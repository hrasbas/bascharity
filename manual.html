body {

.stage {

  height:520px;

  transform-style: preserve-3d;
  touch-action: none;
  transform: translateX(-40px) rotateY(-18deg) rotateX(6deg);
}

.back-cover-base {
  position: absolute;
  top: -2mm;
  left: 0;
  width: calc(100% + 2mm);
  height: calc(100% + 4mm);
  background: linear-gradient(135deg, #d7e1ee 0%, #c7d2e0 100%);
  border: 1.5px solid #ece7de;
  border-radius: 2px;
  box-shadow: inset 0 0 34px rgba(0,0,0,.06), inset -16px 0 30px rgba(0,0,0,.04), -6px 12px 28px rgba(0,0,0,0.22);
  z-index: 1;
  cursor: pointer;
}

.spine {
  position: absolute;
  left: -14px;
  top: -2mm;
  width: 14px;
  height: calc(100% + 4mm);
  background: linear-gradient(to right, #64748b, #94a3b8, #cbd5e1);
  border-left: 1px solid #ece7de;
  border-radius: 4px 0 0 4px;
  box-shadow: -2px 0 8px rgba(0,0,0,.2);
  z-index: 80;
}

.page {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform .65s cubic-bezier(.25, 1, .5, 1);
  will-change: transform;
  cursor: grab;
  pointer-events: auto;
}
.page:active { cursor: grabbing; }

.cover-page .page-face {
  background:

/* 1. Flexible Opening Hint Animation (Peeking) */
@keyframes peekAnimation {
  0%   { transform: rotateY(0deg); }
  20%  { transform: rotateY(-22deg); }
  40%  { transform: rotateY(0deg); }
  60%  { transform: rotateY(-15deg); }
  80%  { transform: rotateY(0deg); }
  100% { transform: rotateY(0deg); }

.page.peek-hint {

const stage = document.getElementById('bookStage');

function makePage(data, index) {
  const page = document.createElement('div');
  page.className = 'page' + (index === 0 ? ' cover-page' : '');
  page.dataset.index = index;
  page.dataset.state = 'closed';
  
  if (data.cover) {
    page.innerHTML = `

            </svg>
            <div class="main-title-unified" translate="no" class="notranslate">${data.title}</div>

      <div class="wrinkle-fold"></div>
      <div class="corner-curl"></div>
    `;
  } else if (data.isIndex) {

          </ul>

        <div class="page-footer">

          <span class="flip-hint">(പേജ് മറിക്കുക)</span>
        </div>

  } else {

const pages = Array.from(document.querySelectorAll('.page'));
let draggingPage = null;
let startX = 0;
let startY = 0;
let currentRotateY = 0;

let peekInterval = null;
let autoCloseTimer = null;

function isBookOpen() {
  return pages.some(p => p.dataset.state === 'open');
}

function closeAllPages() {
  pages.forEach(p => {
    p.dataset.state = 'closed';
  });
  syncStack();
  startPeekInterval();
}

function startPeekInterval() {
  stopPeekInterval();
  peekInterval = setInterval(() => {
    if (!isBookOpen()) {
      const topClosedPage = pages.find(p => p.dataset.state === 'closed');
      if (topClosedPage) {
        topClosedPage.classList.add('peek-hint');
        setTimeout(() => {
          topClosedPage.classList.remove('peek-hint');
        }, 1800);
      }
    } else {
      stopPeekInterval();
    }
  }, 5000);
}

function stopPeekInterval() {
  if (peekInterval) {
    clearInterval(peekInterval);
    peekInterval = null;
  }
}

function resetAutoCloseTimer() {
  if (autoCloseTimer) clearTimeout(autoCloseTimer);
  if (isBookOpen()) {
    stopPeekInterval();
    // 1 Minutes = 60000 ms Auto-Close
    autoCloseTimer = setTimeout(() => {
      closeAllPages();
    }, 60000);
  } else {
    startPeekInterval();
  }
}

// Close Book on Screen Scroll
window.addEventListener('scroll', () => {
  if (isBookOpen()) {
    closeAllPages();
  }
}, { passive: true });

window.addEventListener('touchmove', resetAutoCloseTimer, { passive: true });
window.addEventListener('mousemove', resetAutoCloseTimer, { passive: true });

function syncStack() {
  pages.forEach((page, i) => {
    const isFlipped = page.dataset.state === 'open';
    if (isFlipped) {
      page.style.zIndex = i + 2;
      page.style.transform = 'rotateY(-180deg)';
    } else {
      page.style.zIndex = (pages.length - i) + 2;
      page.style.transform = 'rotateY(0deg)';
    }
  });
}

function getPoint(e) {
  if (e.clientX !== undefined) return { x: e.clientX, y: e.clientY };
  if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: 0, y: 0 };
}

function setPageVisuals(page, rotateY, px, py) {
  const wrinkle = page.querySelector('.wrinkle-fold');
  const curl = page.querySelector('.corner-curl');
  const progress = Math.abs(rotateY) / 180;
  const curve = Math.sin(progress * Math.PI);
  
  const curveZ = curve * 28; 
  
  page.style.transform = `translate3d(0, 0, ${curveZ}px) rotateY(${rotateY}deg)`;
  page.style.filter = `drop-shadow(${curve * -18}px ${curve * 14}px 22px rgba(0,0,0,0.4))`;
  
  if (wrinkle) wrinkle.style.opacity = String(curve * 1.0);
  if (curl) {
    const curlSize = Math.max(0, Math.min(190, curve * 170));
    curl.style.width = curlSize + 'px';
    curl.style.height = curlSize + 'px';
    curl.style.opacity = String(Math.min(1, curve * 1.6));
  }
}

function clearPageVisuals(page) {
  const wrinkle = page.querySelector('.wrinkle-fold');
  const curl = page.querySelector('.corner-curl');
  page.style.filter = 'none';
  if (wrinkle) wrinkle.style.opacity = '0';
  if (curl) {
    curl.style.width = '0px';
    curl.style.height = '0px';
    curl.style.opacity = '0';
  }
}

pages.forEach((page) => {
  page.addEventListener('pointerdown', (e) => {
    resetAutoCloseTimer();
    const pt = getPoint(e);
    draggingPage = page;
    startX = pt.x;
    startY = pt.y;
    currentRotateY = page.dataset.state === 'open' ? -180 : 0;
    
    page.style.transition = 'none';
    page.style.zIndex = 999;
    page.setPointerCapture?.(e.pointerId);
  });

  page.addEventListener('pointermove', (e) => {
    if (draggingPage !== page) return;
    const pt = getPoint(e);
    const dx = pt.x - startX;
    const dy = pt.y - startY;
    
    if (page.dataset.state === 'open') {
      currentRotateY = -180 + Math.min(180, Math.max(0, dx * 0.75));
    } else {
      currentRotateY = Math.max(-180, Math.min(0, dx * 0.75));
    }
    
    setPageVisuals(page, currentRotateY, Math.abs(dx), Math.abs(dy));
  });

  const finishTurn = () => {
    if (draggingPage !== page) return;
    const shouldOpen = currentRotateY < -90;
    page.style.transition = 'transform .65s cubic-bezier(.25, 1, .5, 1)';
    clearPageVisuals(page);
    
    if (shouldOpen) {
      page.dataset.state = 'open';
    } else {
      page.dataset.state = 'closed';
    }
    
    draggingPage = null;
    syncStack();
    resetAutoCloseTimer();
  };

  page.addEventListener('pointerup', finishTurn);
  page.addEventListener('pointercancel', finishTurn);
});

// Double Swipe Logic on Blue Base Cover (അവസാന നീല അട്ടി)
const blueCover = document.getElementById('blueCoverBase');
let coverSwipeCount = 0;
let coverStartX = 0;
let coverSwipeTimer = null;

blueCover.addEventListener('pointerdown', (e) => {
  coverStartX = getPoint(e).x;
});

blueCover.addEventListener('pointerup', (e) => {
  const endX = getPoint(e).x;
  const diffX = Math.abs(endX - coverStartX);

  // If dragged/swiped horizontally more than 30px
  if (diffX > 30) {
    coverSwipeCount++;
    if (coverSwipeTimer) clearTimeout(coverSwipeTimer);

    if (coverSwipeCount >= 2) {
      closeAllPages();
      coverSwipeCount = 0;
    } else {
      coverSwipeTimer = setTimeout(() => {
        coverSwipeCount = 0;
      }, 1200); // 1.2s time limit for second swipe
    }
  }
});

syncStack();
startPeekInterval();

// Analytics Tracking
let sessionStartTime = Date.now();
let bookOpenCount = 0;

function trackBookOpen() {
  bookOpenCount++;
  if (typeof gtag === 'function') {
    gtag('event', 'book_open', { 'event_category': 'BAS Manual', 'open_count': bookOpenCount });
  }
}

function trackPageView(pageIndex) {
  let pageName = pageIndex === 1 ? 'Cover Page' : 'Page ' + (pageIndex - 1);
  if (typeof gtag === 'function') {
    gtag('event', 'page_view_manual', { 'event_category': 'BAS Manual Page Turn', 'page_number': pageName, 'event_label': pageName });
  }
}

pages.forEach((page, index) => {
  page.addEventListener('pointerup', () => {
    setTimeout(() => {
      if (page.dataset.state === 'open') {
        if (bookOpenCount === 0) trackBookOpen();
        trackPageView(index + 1);
      }
    }, 700);
  });
});

window.addEventListener('beforeunload', () => {
  let timeSpentSeconds = Math.round((Date.now() - sessionStartTime) / 1000);
  if (typeof gtag === 'function') {
    gtag('event', 'time_spent_manual', { 'event_category': 'BAS Manual Engagement', 'time_in_seconds': timeSpentSeconds, 'event_label': timeSpentSeconds + ' seconds' });
  }
});
</script>

<script>
/* =========================================
   BOOK: 1-MINUTE IDLE AUTO-CLOSE
   + MAIN PAGE SCROLL CLOSE RECEIVER
   ========================================= */

(function () {
  let idleTimer = null;
  let lastBookTouchTime = 0;
  const IDLE_LIMIT = 60000; /* 1 minute */

  function bookIsOpen() {
    return typeof isBookOpen === "function" && isBookOpen();
  }

  function closeBook() {
    if (typeof closeAllPages === "function") {
      closeAllPages();
    }
  }

  function startOrResetIdleTimer() {
    if (idleTimer) {
      clearTimeout(idleTimer);
    }

    if (!bookIsOpen()) {
      return;
    }

    lastBookTouchTime = Date.now();

    idleTimer = setTimeout(function checkIdle() {
      if (!bookIsOpen()) {
        return;
      }

      const inactiveFor = Date.now() - lastBookTouchTime;

      if (inactiveFor >= IDLE_LIMIT) {
        closeBook();
      } else {
        idleTimer = setTimeout(checkIdle, IDLE_LIMIT - inactiveFor);
      }
    }, IDLE_LIMIT);
  }

  /* Book page-ൽ touch/click/page flip ഉണ്ടായാൽ timer reset */
  document.addEventListener("pointerdown", startOrResetIdleTimer, { passive: true });
  document.addEventListener("touchstart", startOrResetIdleTimer, { passive: true });
  document.addEventListener("click", startOrResetIdleTimer, { passive: true });

  /* App/browser background-ൽ നിന്ന് തിരികെ വരുമ്പോൾ elapsed time check */
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && bookIsOpen()) {
      if (Date.now() - lastBookTouchTime >= IDLE_LIMIT) {
        closeBook();
      } else {
        startOrResetIdleTimer();
      }
    }
  });

  window.addEventListener("focus", function () {
    if (bookIsOpen()) {
      if (Date.now() - lastBookTouchTime >= IDLE_LIMIT) {
        closeBook();
      } else {
        startOrResetIdleTimer();
      }
    }
  });

  /* Main/Index HTML scroll message സ്വീകരിച്ച് book close */
  window.addEventListener("message", function (event) {
    if (event.data && event.data.type === "close_book") {
      closeBook();
    }
  });

  /* ആദ്യ page flip/open കഴിഞ്ഞ് timer ആരംഭിക്കാൻ */
  document.addEventListener("pointerup", function () {
    setTimeout(startOrResetIdleTimer, 50);
  }, { passive: true });
})();
</script>
