 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BAS CHARITY INTERNATIONAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

html, body { 
  width: 100%; 
  height: 100%; 
  overflow: hidden;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0f172a;
  font-family: Georgia, serif;
  min-height: 100vh;
}

/* ബുക്കിന്റെ വീതി കുറച്ച് നീളം കൂട്ടി. മറിച്ചിടാൻ ഇടതുവശത്ത് സ്ഥലം നൽകാൻ ലേഔട്ട് ക്രമീകരിച്ചു */
.stage {
  position: relative;
  width: 360px; /* വീതി കുറച്ചു */
  height: 640px; /* നീളം കൂട്ടി */
  perspective: 2000px;
  transform-style: preserve-3d;
  touch-action: none;
  /* ബുക്കിന് ചെറിയ ചായ്‌വും ഇടത് വശത്തേക്ക് മറിച്ചിടാൻ പാകത്തിൽ സ്പേസും */
  transform: rotateY(-8deg) rotateX(2deg) translateX(40px);
}

/* 1.5mm സ്റ്റിച്ച് ബോർഡർ + പേജുകൾ തമ്മിൽ മുട്ടിനിൽക്കുന്ന തനിമ */
.page-face {
  position: absolute;
  inset: 0;
  padding: 30px 25px 25px 25px;
  background: #fffdf8;
  /* 1.5mm സ്റ്റിച്ച് ഡാഷ്ഡ് ബോർഡർ (വശങ്ങളിൽ പഴയതുപോലെ) */
  border: 1.5px dashed #8b9bb4;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  pointer-events: none;
  border-radius: 0 3px 3px 0;
  /* കൃത്രിമ ബൈൻഡിംഗ് ഇല്ലാതെ പേജുകൾ ഒട്ടിയിരിക്കുന്ന സ്വാഭാവിക ഷാഡോ മാത്രം */
  box-shadow: inset 12px 0 15px -5px rgba(0, 0, 0, 0.18);
}

.front-face { z-index: 2; }
.back-face { 
  z-index: 1; 
  transform: rotateY(180deg);
  background: #fdfbf7;
  border: 1.5px dashed #8b9bb4;
  border-radius: 3px 0 0 3px;
  /* തിരിഞ്ഞിരിക്കുന്ന പേജിന്റെ നടുവിലെ ഷാഡോ */
  box-shadow: inset -12px 0 15px -5px rgba(0, 0, 0, 0.18);
}

.cover-page .page-face {
  background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
  border: 1.5px dashed #64748b;
}

.cover-title {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
  padding: 40px 20px;
  z-index: 10;
  pointer-events: none;
}

.brand-logo {
  width: 55px;
  height: 55px;
  margin-bottom: 8px;
  fill: #000000;
}

.main-title-unified {
  font-family: 'Arial Black', Gadget, sans-serif;
  font-size: 18px;
  font-weight: 900;
  color: #000000;
  letter-spacing: 1px;
  line-height: 1.25;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.sub-title-dark {
  font-family: sans-serif;
  font-size: 10px;
  font-weight: 900;
  color: #000000;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  border-top: 1px solid #000;
  border-bottom: 1px solid #000;
  padding: 4px;
}

.author-handwriting-3d {
  font-family: 'Dancing Script', cursive;
  font-size: 22px;
  font-weight: 800;
  color: #1a1a1a;
}

.page {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform .6s cubic-bezier(.25, 1, .5, 1);
  will-change: transform;
  cursor: grab;
  pointer-events: auto;
}

.right-page-box {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  text-align: left;
}

.content-title {
  font-size: 14px;
  color: #000000;
  font-weight: 900;
  border-bottom: 1px solid #cbd5e1;
  padding-bottom: 6px;
  margin-bottom: 12px;
  text-transform: uppercase;
}

.content-body {
  font-size: 11px;
  line-height: 1.5;
  color: #1e293b;
  text-align: justify;
  flex-grow: 1;
}
.content-body p { margin-bottom: 8px; }

.index-list { list-style: none; padding: 0; }
.index-item {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  padding: 3px 0;
  border-bottom: 1px dashed #cbd5e1;
  color: #000;
  font-weight: 700;
}

.page-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px dashed #cbd5e1;
  padding-top: 4px;
}

.page-number {
  font-size: 10px;
  color: #000;
  font-weight: 900;
  font-family: sans-serif;
}

.page-shadow {
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, rgba(0,0,0,0.15) 0%, transparent 20%);
  pointer-events: none;
  opacity: 0;
}
</style>
</head>
<body>

<div class="stage" id="bookStage"></div>

<script>
const pagesData = [
  {
    cover: true,
    title: 'BAS CHARITY<br>INTERNATIONAL',
    subtitle: 'OFFICIAL POLICY & DOCUMENTATION MANUAL',
    author: 'Mohamed Basheer Peringala'
  },
  {
    isIndex: true,
    title: 'INDEX / സൂചിക (PART 1)',
    pageNo: 'Page 01',
    items: [
      { name: '01. Welcome', page: 'Page 03' },
      { name: '02. About BAS Charity International', page: 'Page 04' },
      { name: '03. Founder\'s Message', page: 'Page 05' },
      { name: '04. Vision', page: 'Page 06' },
      { name: '05. Mission', page: 'Page 07' },
      { name: '06. How BAS Charity International Works', page: 'Page 08' },
      { name: '07. Affiliate Disclosure', page: 'Page 09' },
      { name: '08. Charity Commitment', page: 'Page 10' },
      { name: '09. Privacy Policy', page: 'Page 11' },
      { name: '10. Terms & Conditions', page: 'Page 12' },
      { name: '11. User Responsibilities', page: 'Page 13' },
      { name: '12. Disclaimer', page: 'Page 14' }
    ]
  },
  {
    isIndex: true,
    title: 'INDEX / സൂചിക (PART 2)',
    pageNo: 'Page 02',
    items: [
      { name: '13. Copyright Notice', page: 'Page 15' },
      { name: '14. Intellectual Property Rights', page: 'Page 16' },
      { name: '15. Donations & Charity Policy', page: 'Page 17' },
      { name: '16. Security & Data Protection', page: 'Page 18' },
      { name: '17. Community Guidelines', page: 'Page 19' },
      { name: '18. FAQ', page: 'Page 20' },
      { name: '19. Contact Information', page: 'Page 21' },
      { name: '20. Updates & Amendments', page: 'Page 22' },
      { name: '21. Thank You', page: 'Page 23' }
    ]
  },
  {
    title: "WELCOME",
    content: `
      <p>Welcome to <strong>BAS Charity International</strong>.</p>
      <p>Thank you for visiting our platform.</p>
      <p>BAS Charity International is a humanitarian initiative that aims to connect everyday shopping with charitable giving. Our goal is simple: to help people support humanitarian causes without paying anything extra.</p>
      <p>When you shop through our trusted affiliate partners, you enjoy the same products, prices, offers, and services available on the original websites. If your purchase qualifies, we may receive an affiliate commission from the merchant. A significant portion of this income is intended to support charitable and humanitarian activities.</p>
      <p>This book explains our mission, policies, commitments, and responsibilities. We encourage every visitor to read it carefully to better understand how our platform operates.</p>
      <p>Thank you for being part of this meaningful journey.</p>
      <p style="text-align: center; margin-top: 10px;"><strong>YOUR PURCHASE SATISFIES A HUNGER®</strong></p>
    `
  }
];

const stage = document.getElementById('bookStage');

function makePage(data, index) {
  const page = document.createElement('div');
  page.className = 'page' + (index === 0 ? ' cover-page' : '');
  page.dataset.index = index;
  page.dataset.state = 'closed';
  
  if (data.cover) {
    page.innerHTML = `
      <div class="page-face front-face">
        <div class="cover-title">
          <div>
            <svg class="brand-logo" viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
            </svg>
            <div class="main-title-unified">${data.title}</div>
            <div class="sub-title-dark">${data.subtitle}</div>
          </div>
          <div class="author-handwriting-3d">${data.author}</div>
        </div>
      </div>
      <div class="page-face back-face"></div>
      <div class="page-shadow"></div>
    `;
  } else if (data.isIndex) {
    page.innerHTML = `
      <div class="page-face front-face">
        <div class="right-page-box">
          <div class="content-title">${data.title}</div>
          <ul class="index-list">
            ${data.items.map(item => `<li class="index-item"><span>${item.name}</span><span>${item.page}</span></li>`).join('')}
          </ul>
        </div>
        <div class="page-footer">
          <span class="page-number">${data.pageNo}</span>
        </div>
      </div>
      <div class="page-face back-face"></div>
      <div class="page-shadow"></div>
    `;
  } else {
    page.innerHTML = `
      <div class="page-face front-face">
        <div class="right-page-box">
          <div class="content-title">${data.title}</div>
          <div class="content-body">
            ${data.content}
          </div>
        </div>
        <div class="page-footer">
          <span class="page-number">Page 0${index}</span>
        </div>
      </div>
      <div class="page-face back-face"></div>
      <div class="page-shadow"></div>
    `;
  }
  return page;
}

pagesData.forEach((p, i) => stage.appendChild(makePage(p, i)));

const pages = Array.from(document.querySelectorAll('.page'));
let draggingPage = null;
let startX = 0;
let currentRotateY = 0;

function syncStack() {
  pages.forEach((page, i) => {
    const isFlipped = page.dataset.state === 'open';
    if (isFlipped) {
      page.style.zIndex = i + 2;
      page.style.transform = 'rotateY(-180deg)';
    } else {
      page.style.zIndex = (pages.length - i) + 2;
      page.style.transform = 'rotateY(0deg)';
    }
  });
}

function getPoint(e) {
  if (e.clientX !== undefined) return { x: e.clientX };
  if (e.touches && e.touches[0]) return { x: e.touches[0].clientX };
  return { x: 0 };
}

pages.forEach((page) => {
  page.addEventListener('pointerdown', (e) => {
    const pt = getPoint(e);
    draggingPage = page;
    startX = pt.x;
    currentRotateY = page.dataset.state === 'open' ? -180 : 0;
    page.style.transition = 'none';
    page.style.zIndex = 999;
    page.setPointerCapture?.(e.pointerId);
  });

  page.addEventListener('pointermove', (e) => {
    if (draggingPage !== page) return;
    const pt = getPoint(e);
    const dx = pt.x - startX;
    
    if (page.dataset.state === 'open') {
      currentRotateY = -180 + Math.min(180, Math.max(0, dx * 0.8));
    } else {
      currentRotateY = Math.max(-180, Math.min(0, dx * 0.8));
    }
    
    const shadow = page.querySelector('.page-shadow');
    const progress = Math.abs(currentRotateY) / 180;
    if(shadow) shadow.style.opacity = Math.sin(progress * Math.PI);
    
    page.style.transform = `rotateY(${currentRotateY}deg)`;
  });

  const finishTurn = () => {
    if (draggingPage !== page) return;
    const shouldOpen = currentRotateY < -90;
    page.style.transition = 'transform .5s ease-out';
    const shadow = page.querySelector('.page-shadow');
    if(shadow) shadow.style.opacity = 0;
    
    if (shouldOpen) {
      page.dataset.state = 'open';
    } else {
      page.dataset.state = 'closed';
    }
    
    draggingPage = null;
    syncStack();
  };

  page.addEventListener('pointerup', finishTurn);
  page.addEventListener('pointercancel', finishTurn);
});

syncStack();
</script>
</body>
</html>
