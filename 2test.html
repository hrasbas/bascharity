 <!-- ========================================== -->
<!-- 1. CSS STYLES (ഡിസൈനും 3D അനിമേഷനും) -->
<!-- ========================================== -->
<style>
  /* 3 ബട്ടണുകളും ഉൾപ്പെടുന്ന ഒറ്റ കൊടി (Right Side Wrapper) */
  .flag-cloth-container {
    position: fixed;
    right: 0; /* വലതുവശത്ത് ഉറപ്പിച്ചു നിർത്തിയിരിക്കുന്നു */
    bottom: 0px; 
    z-index: 9997;
    display: flex;
    flex-direction: column;
    gap: 0px; /* തുണി കീറിയതുപോലെ തോന്നാതിരിക്കാൻ gap 0 ആക്കി */
    
    /* വലതുവശത്തുനിന്ന് ഇടത്തോട്ട് ഒറ്റപ്പീസായി 3D അലയടിക്കാൻ */
    transform-origin: right center;
    perspective: 1000px;
    animation: singlePiece3DClothWave 2.5s infinite ease-in-out alternate;
  }

  /* കൊടിയുടെ സ്ട്രിപ്പുകൾ (Segments) */
  .flag-segment {
    width: 4cm;   
    height: 3cm;  
    border: none;
    cursor: pointer;
    box-shadow: -4px 2px 8px rgba(0, 0, 0, 0.3);
    
    /* Horizontal Text / ബോക്സിന് അനുയോജ്യമായ മാക്സിമം ഫോണ്ട് വലിപ്പം */
    writing-mode: horizontal-tb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 26px; /* മാക്സിമം റീഡബിൾ വലിപ്പം */
    text-align: center;
    line-height: 1.1;
    padding: 0 8px;
    
    transition: filter 0.2s ease;
  }

  /* മുകൾവശത്തെ സ്ട്രിപ്പ് (Sky Blue) - മുകളിലെ അരികുകൾ വളഞ്ഞത് */
  .flag-skyblue {
    background: linear-gradient(135deg, #87CEEB, #00BFFF);
    color: #000000;
    border-radius: 12px 0 0 0;
    text-shadow: 0px 0px 2px rgba(255, 255, 255, 0.8);
  }

  /* നടുവിലത്തെ സ്ട്രിപ്പ് (White) */
  .flag-white {
    background: linear-gradient(135deg, #ffffff, #f0f0f0);
    color: #000000;
    text-shadow: 0px 0px 1px rgba(0, 0, 0, 0.2);
  }

  /* താഴത്തെ സ്ട്രിപ്പ് (Red) - താഴത്തെ അരികുകൾ വളഞ്ഞത് */
  .flag-red {
    background: linear-gradient(135deg, #ff3d00, #dd2c00);
    color: #ffffff;
    border-radius: 0 0 0 12px;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
  }

  .flag-segment:hover,
  .flag-segment:active {
    filter: brightness(1.08);
  }

  /* മുഴുവൻ തുണിയും ഒന്നിച്ച് flexible ആയി അലയടിക്കുന്ന 3D അനിമേഷൻ */
  @keyframes singlePiece3DClothWave {
    0% {
      transform: rotateY(0deg) rotateZ(0deg) skewY(0deg) translateY(0px);
    }
    33% {
      transform: rotateY(-25deg) rotateZ(2deg) skewY(3deg) translateY(-4px);
    }
    66% {
      transform: rotateY(15deg) rotateZ(-2deg) skewY(-3deg) translateY(3px);
    }
    100% {
      transform: rotateY(-30deg) rotateZ(3deg) skewY(4deg) translateY(-5px);
    }
  }
</style>


<!-- ========================================== -->
<!-- 2. HTML STRUCTURE (കൊടിയുടെ ഭാഗങ്ങൾ) -->
<!-- ========================================== -->
<div class="flag-cloth-container">
  <!-- Sky Blue - Change Language -->
  <button class="flag-segment flag-skyblue" onclick="handleLangClick()">Change Language</button>
  
  <!-- White - Change Country -->
  <button class="flag-segment flag-white" onclick="handleCountryClick()">Change Country</button>
  
  <!-- Red - Change Category -->
  <button class="flag-segment flag-red" onclick="handleCategoryClick()">Change Category</button>
</div>


<!-- ========================================== -->
<!-- 3. JAVASCRIPT (ഫങ്ഷനുകൾ) -->
<!-- ========================================== -->
<script>
  function handleLangClick() {
    console.log("Change Language clicked");
  }

  function handleCountryClick() {
    console.log("Change Country clicked");
  }

  function handleCategoryClick() {
    console.log("Change Category clicked");
  }
</script>
