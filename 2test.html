 <!-- ==========================================
     BAS CHARITY - FULL PWA & SHOP INTERACTION CODE
     ========================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
<!-- 001 -->
<meta charset="UTF-8">
<!-- 002 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 003 -->
<title>BAS CHARITY INTERNATIONAL™</title>
<!-- 004 -->

<style>
/* 1. സേവ് ഐക്കൺ / PWA ഇൻസ്റ്റാൾ കാർഡ് ഡിസൈൻ */
.bas-save-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(135deg, #f5efe6 0%, #e8dfd1 100%);
  border: 1px solid rgba(139, 115, 85, 0.2);
  border-radius: 16px;
  padding: 16px 20px;
  margin: 20px auto;
  max-width: 90%;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

.bas-save-left {
  display: flex;
  align-items: center;
  gap: 15px;
}

.bas-save-icon-box {
  background: #1b382b;
  color: #fff;
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  box-shadow: 0 4px 10px rgba(27, 56, 43, 0.3);
}

.bas-save-text h4 {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  color: #1b382b;
}

.bas-save-text p {
  margin: 3px 0 0 0;
  font-size: 13px;
  color: #555;
}

.bas-save-btn {
  background: #1b382b;
  color: #fff;
  border: none;
  padding: 10px 22px;
  font-size: 15px;
  font-weight: 700;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s ease;
  box-shadow: 0 4px 12px rgba(27, 56, 43, 0.25);
}

.bas-save-btn:active {
  transform: scale(0.95);
}

/* 2. ഫേസ്ബുക്ക് ഇൻ-ആപ്പ് ബ്രൗസർ ഗൈഡൻസ് മോഡൽ */
#basFbModal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.85);
  z-index: 999999;
  justify-content: center;
  align-items: center;
  padding: 20px;
  box-sizing: border-box;
}

.bas-fb-content {
  background: #ffffff;
  padding: 25px;
  border-radius: 20px;
  max-width: 340px;
  width: 100%;
  text-align: center;
  color: #222;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.bas-fb-content h3 {
  margin-top: 0;
  color: #1b382b;
  font-size: 20px;
}

.bas-fb-content p {
  font-size: 14px;
  line-height: 1.5;
  color: #444;
  text-align: left;
}

.bas-fb-close {
  background: #1b382b;
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 700;
  margin-top: 15px;
  cursor: pointer;
  width: 100%;
}
</style>

<!-- HTML STRUCTURE -->
<!-- ചിത്രത്തിൽ കാണുന്നതുപോലുള്ള Save Icon / PWA ഇൻസ്റ്റാൾ സെക്ഷൻ -->
<div class="bas-save-card" id="basInstallTrigger">
  <div class="bas-save-left">
    <div class="bas-save-icon-box">
      📥
    </div>
    <div class="bas-save-text">
      <h4>Save Icon</h4>
      <p>Quick Access to Shopping</p>
    </div>
  </div>
  <button class="bas-save-btn">
    SAVE 📥
  </button>
</div>

<!-- ഫേസ്ബുക്ക് ബ്രൗസർ ഗൈഡൻസ് പോപ്പ്അപ്പ് -->
<div id="basFbModal">
  <div class="bas-fb-content">
    <h3>⚠️ Open in External Browser</h3>
    <p>You are using Facebook's in-app browser. To install the app properly:</p>
    <p><b>1.</b> Click the <b>Three Dots (...)</b> at the top right.<br>
       <b>2.</b> Select <b>"Open in External Browser"</b> (Chrome/Safari).<br>
       <b>3.</b> Then click the **SAVE** button to install!</p>
    <button class="bas-fb-close" onclick="document.getElementById('basFbModal').style.display='none'">Got It</button>
  </div>
</div>

<script>
/* ==========================================
   JAVASCRIPT LOGIC
   ========================================== */

document.addEventListener("DOMContentLoaded", function () {
  
  // 1. ഷോപ്പുകളിലേക്ക് / 'ശനി' സെക്ഷനിലേക്ക് റീഡയറക്ട് ചെയ്യുന്ന ഫങ്ഷൻ
  function redirectToShops() {
    // നിങ്ങളുടെ വെബ്‌സൈറ്റിലെ ഷോപ്പുകൾ സ്ഥിതി ചെയ്യുന്ന സെക്ഷന്റെ ID അല്ലെങ്കിൽ ലിങ്ക് ഇവിടെ നൽകാം
    // ഉദാഹരണത്തിന്: window.location.href = "#shops-section"; അല്ലെങ്കിൽ ഒരു പ്രത്യേക പേജ് ലിങ്ക്
    const shopSection = document.getElementById("shops-section") || document.querySelector(".shops-container");
    if (shopSection) {
      shopSection.scrollIntoView({ behavior: 'smooth' });
    } else {
      // സെക്ഷൻ ഐഡി ലഭ്യമല്ലെങ്കിൽ ഷോപ്പ് ലിങ്കിലേക്ക് നേരിട്ട് പോകാൻ
      console.log("Navigating to Shops category...");
      // നിങ്ങൾക്ക് ആവശ്യമുള്ള ലിങ്ക് ഇവിടെ നൽകാം, ഉദാഹരണത്തിന്:
      // window.location.href = "shops.html";
    }
  }

  // 'SHOP NOW' ബട്ടണിനും പുതിയ ഐക്കണുകൾക്കും ഒരേ ഫങ്ഷൻ കണക്റ്റ് ചെയ്യുന്നു
  const shopNowBtn = document.querySelector(".shop-now-btn") || document.getElementById("shopNowBtn");
  if (shopNowBtn) {
    shopNowBtn.addEventListener("click", redirectToShops);
  }

  // ചിത്രത്തിലുള്ള പുതിയ ഐക്കണുകൾക്കോ മറ്റ് ഷോപ്പ് ബട്ടണുകൾക്കോ ഈ ക്ലാസ് നൽകിയാൽ 'ശനി' ക്ലിക്ക് ചെയ്ത ഫീൽ കിട്ടും
  document.querySelectorAll(".trigger-shop-navigation").forEach(item => {
    item.addEventListener("click", redirectToShops);
  });


  // 2. PWA ഇൻസ്റ്റാളേഷൻ & ഫേസ്ബുക്ക് ഇൻ-ആപ്പ് ബ്രൗസർ ഹാൻഡ്‌ലിംഗ്
  let deferredPrompt;
  const installTrigger = document.getElementById("basInstallTrigger");
  const fbModal = document.getElementById("basFbModal");

  // ഫേസ്ബുക്ക് ബ്രൗസർ ആണോ എന്ന് പരിശോധിക്കുന്നു
  function isFacebookApp() {
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    return (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);
  }

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
  });

  if (installTrigger) {
    installTrigger.addEventListener("click", async () => {
      // ഫേസ്ബുക്ക് ബ്രൗസറിലാണെങ്കിൽ ഗൈഡൻസ് മോഡൽ കാണിക്കുക
      if (isFacebookApp()) {
        if (fbModal) fbModal.style.display = "flex";
        return;
      }

      // സാധാരണ ബ്രൗസറാണെങ്കിൽ PWA ഇൻസ്റ്റാൾ പ്രോംപ്റ്റ് ചെയ്യുക
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('User accepted the install prompt');
          // Google Analytics Event Tracking
          if (typeof gtag === 'function') {
            gtag('event', 'pwa_install', {
              'event_category': 'Engagement',
              'event_label': 'App Installed Successfully'
            });
          }
        }
        deferredPrompt = null;
      } else {
        alert("App is already installed or your browser doesn't support direct installation from this button. You can add it to home screen from browser settings!");
      }
    });
  }

});
</script>
</body>

</html>
