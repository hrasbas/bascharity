<script>
/* 009 — SAME SHOPPING ACTION AS SATURN */

function basPosterShoppingAction(){

  var categoryElement =
      document.getElementById("categoryHeading");

  if(categoryElement){

    categoryElement.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

    categoryElement.click();

  }
}


/* 010 — SHOP NOW */
document
.getElementById("basPosterShopNow")
.addEventListener("click",function(e){

  e.preventDefault();

  basPosterShoppingAction();

});


/* 011 — APP ICON = SHOPPING */
document
.getElementById("basPosterAppIcon")
.addEventListener("click",function(e){

  e.preventDefault();

  basPosterShoppingAction();

});


/* 012 — SAVE ICON */
var basPosterSave =
    document.getElementById("basPosterSave");

var basSaveHelp =
    document.getElementById("basSaveHelp");

var basSaveClose =
    document.getElementById("basSaveClose");

var basPosterInstallPrompt = null;


/* 013 — REAL CHROME INSTALL PROMPT */
window.addEventListener(
  "beforeinstallprompt",
  function(e){

    e.preventDefault();

    basPosterInstallPrompt = e;

  }
);


/* 014 — SAVE CLICK */
basPosterSave.addEventListener(
  "click",
  async function(){

    /*
      Chrome-ൽ യഥാർത്ഥ Install prompt
      ലഭ്യമാണെങ്കിൽ ആദ്യം അതുതന്നെ കാണിക്കും.
    */

    if(basPosterInstallPrompt){

      await basPosterInstallPrompt.prompt();

      await basPosterInstallPrompt.userChoice;

      basPosterInstallPrompt = null;

      return;

    }

    /*
      Facebook / WhatsApp / unsupported browser:
      ശരിയായ manual procedure കാണിക്കും.
    */

    basSaveHelp.classList.add("show");

  }
);


/* 015 — CLOSE */
basSaveClose.addEventListener(
  "click",
  function(){

    basSaveHelp.classList.remove("show");

  }
);


/* 016 — OUTSIDE CLICK CLOSE */
basSaveHelp.addEventListener(
  "click",
  function(e){

    if(e.target === basSaveHelp){

      basSaveHelp.classList.remove("show");

    }

  }
);
</script>
