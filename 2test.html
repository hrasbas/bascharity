 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BAS CHARITY INTERNATIONAL - Zoomable Book</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Dancing+Script:wght@700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">

<style>
* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
  user-select: none; 
  -webkit-user-select: none; 
}

html, body { 
  width: 100%; 
  height: 100vh; 
  overflow: hidden; 
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at center, #111827 0%, #030712 100%);
  font-family: 'Merriweather', Georgia, serif;
  padding: 10px;
}

/* Book Stage Container - initially small, fully proportional */
.stage {
  position: relative;
  width: min(260px, 42vw);
  height: min(370px, 55vh);
  perspective: 2000px;
  perspective-origin: 50% 50%;
  transform-style: preserve-3d;
  touch-action: none;
  transform: rotateY(-6deg) rotateX(2deg);
  transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  cursor: pointer;
}

/* Zoomed state when touched */
.stage.zoomed {
  width: min(500px, 92vw);
  height: min(660px, 82vh);
  transform: rotateY(0deg) rotateX(0deg);
  z-index: 1000;
}

/* Realistic Hardcover Base Back */
.book-base {
  position: absolute;
  top: -4px;
  left: -6px;
  width: calc(100% + 12px);
  height: calc(100% + 8px);
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  border-radius: 4px 10px 10px 4px;
  box-shadow: 
    -15px 15px 30px rgba(0,0,0,0.8),
    inset 2px 2px 4px rgba(255,255,255,0.1),
    inset -3px -3px 6px rgba(0,0,0,0.7);
  z-index: 0;
}

/* Spine / Book Joint */
.book-spine {
  position: absolute;
  left: -14px;
  top: -4px;
  width: 18px;
  height: calc(100% + 8px);
  background: linear-gradient(to right, 
    #090d16 0%, 
    #1e293b 25%, 
    #334155 50%, 
    #0f172a 80%, 
    #030712 100%);
  border-radius: 4px 0 0 4px;
  box-shadow: inset 1px 0 2px rgba(255,255,255,0.2);
  z-index: 100;
}

/* Page Stack Effect */
.page {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform .7s cubic-bezier(.2, .8, .2, 1);
  will-change: transform;
}

/* Page Face */
.page-face {
  position: absolute;
  inset: 0;
  padding: 6% 6% 5%;
  background: #fbf9f4;
  background-image: 
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.8), rgba(243,238,225,0.6)),
    linear-gradient(to right, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.02) 5%, transparent 12%);
  border: 1px solid #e2d9c8;
  border-radius: 0 5px 5px 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: inset -10px 0 20px rgba(0,0,0,0.02);
}

/* Cover Styling */
.cover-page .front-face {
  background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
  border: 1px solid #cbd5e1;
  border-left: 2px solid #94a3b8;
}

.cover-content {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
}

.brand-logo {
  width: min(45px, 10vw);
  height: min(45px, 10vw);
  fill: #0f172a;
  margin-bottom: 8px;
}

.main-title {
  font-family: 'Cinzel', serif;
  font-size: clamp(12px, 2vw, 20px);
  font-weight: 800;
  color: #0f172a;
  letter-spacing: 1px;
  line-height: 1.2;
}

.sub-title {
  font-family: sans-serif;
  font-size: clamp(7px, 0.9vw, 9.5px);
  font-weight: 700;
  color: #475569;
  letter-spacing: 1.5px;
  margin-top: 8px;
  border-top: 1px solid #0f172a;
  border-bottom: 1px solid #0f172a;
  padding: 3px 6px;
}

.author-name {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(14px, 2.2vw, 24px);
  font-weight: 700;
  color: #1e293b;
}

/* Typography for content */
.content-title {
  font-family: 'Cinzel', serif;
  font-size: clamp(11px, 1.4vw, 14px);
  color: #0f172a;
  font-weight: 700;
  border-bottom: 1px solid #cbd5e1;
  padding-bottom: 4px;
  margin-bottom: 8px;
}

.content-body {
  font-size: clamp(9.5px, 1.1vw, 12px);
  line-height: 1.5;
  color: #334155;
  text-align: justify;
}
.content-body p { margin-bottom: 8px; }

/* Index Formatting */
.index-list { list-style: none; padding: 0; }
.index-item {
  display: flex;
  justify-content: space-between;
  font-size: clamp(8.5px, 1vw, 10.5px);
  padding: 3px 0;
  border-bottom: 1px dashed #cbd5e1;
  color: #1e293b;
  font-weight: 600;
}

.page-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid #e2e8f0;
  padding-top: 4px;
}

.page-number {
  font-size: 9px;
  color: #64748b;
  font-weight: 700;
  font-family: sans-serif;
}
.flip-hint {
  font-size: 8px;
  color: #3b82f6;
  font-weight: 600;
  font-family: sans-serif;
}

.page-shadow {
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, rgba(0,0,0,0.18) 0%, transparent 20%, rgba(0,0,0,0.08) 100%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.1s ease;
}

.back-face {
  transform: rotateY(180deg);
  background: #f8f6f0;
}
</style>
</head>
<body>

<div class="stage" id="bookStage">
  <div class="book-base"></div>
  <div class="book-spine"></div>
</div>

<script>
const pagesData = [
  {
    cover: true,
    title: 'BAS CHARITY<br>INTERNATIONAL',
    subtitle: 'OFFICIAL POLICY & DOCUMENTATION MANUAL',
    author: 'Mohamed Basheer Peringala'
  },
  {
    isIndex: true,
    title: 'INDEX / സൂചിക (PART 1)',
    pageNo: 'Page 01',
    items: [
      { name: '01. Welcome', page: 'Page 03' },
      { name: '02. About BAS Charity International', page: 'Page 04' },
      { name: '03. Founder\'s Message', page: 'Page 05' },
      { name: '04. Vision', page: 'Page 06' },
      { name: '05. Mission', page: 'Page 07' },
      { name: '06. How BAS Charity International Works', page: 'Page 08' },
      { name: '07. Affiliate Disclosure', page: 'Page 09' },
      { name: '08. Charity Commitment', page: 'Page 10' },
      { name: '09. Privacy Policy', page: 'Page 11' },
      { name: '10. Terms & Conditions', page: 'Page 12' }
    ]
  },
  {
    isIndex: true,
    title: 'INDEX / സൂചിക (PART 2)',
    pageNo: 'Page 02',
    items: [
      { name: '11. User Responsibilities', page: 'Page 13' },
      { name: '12. Disclaimer', page: 'Page 14' },
      { name: '13. Copyright Notice', page: 'Page 15' },
      { name: '14. Intellectual Property Rights', page: 'Page 16' },
      { name: '15. Donations & Charity Policy', page: 'Page 17' },
      { name: '16. Security & Data Protection', page: 'Page 18' },
      { name: '17. Community Guidelines', page: 'Page 19' },
      { name: '18. FAQ', page: 'Page 20' },
      { name: '19. Contact Information', page: 'Page 21' },
      { name: '20. Updates & Thank You', page: 'Page 22' }
    ]
  },
  {
    title: "WELCOME",
    content: `
      <p>Welcome to <strong>BAS Charity International</strong>.</p>
      <p>Thank you for visiting our platform.</p>
      <p>BAS Charity International is a humanitarian initiative that aims to connect everyday shopping with charitable giving. Our goal is simple: to help people support humanitarian causes without paying anything extra.</p>
      <p>When you shop through our trusted affiliate partners, you enjoy the same products, prices, offers, and services available on the original websites. If your purchase qualifies, we may receive an affiliate commission from the merchant. A significant portion of this income is intended to support charitable and humanitarian activities.</p>
      <p>This book explains our mission, policies, commitments, and responsibilities. We encourage every visitor to read it carefully to better understand how our platform operates.</p>
      <p style="text-align: center; margin-top: 10px; font-weight: bold; color: #0f172a;">YOUR PURCHASE SATISFIES A HUNGER®</p>
    `
  },
  {
    title: "ABOUT BAS CHARITY INTERNATIONAL",
    content: `
      <p>BAS Charity International is a humanitarian initiative established to promote charitable support through responsible everyday shopping.</p>
      <p>Our platform connects visitors with trusted affiliate partners, allowing them to purchase products and services at the same prices offered by the original merchants. Eligible purchases may generate affiliate commissions without increasing the customer's cost.</p>
      <p>We are committed to transparency, integrity, accountability, and respect for all people. Our objective is to encourage sustainable charitable support while maintaining a reliable and user-friendly platform for everyone.</p>
      <p>BAS Charity International welcomes people of every nationality, religion, language, and culture. We believe that kindness, honesty, and collective participation can create meaningful and lasting positive change.</p>
    `
  },
  {
    title: "FOUNDER'S MESSAGE",
    content: `
      <p>Welcome to BAS Charity International, and thank you for being part of this meaningful journey.</p>
      <p>This initiative was created with a simple vision: to transform everyday shopping into an opportunity to support humanitarian causes. We believe that even the smallest contribution can make a lasting difference when millions of people participate together.</p>
      <p>Our commitment is to build a platform based on honesty, transparency, integrity, and social responsibility. Every decision we make is guided by our desire to serve humanity with fairness and accountability.</p>
      <p style="margin-top: 10px;"><strong>— Mohamed Basheer Peringala</strong><br><span style="font-size: 9px; color: #64748b;">Founder, BAS Charity International</span></p>
    `
  }
];

const stage = document.getElementById('bookStage');

// Toggle Zoom Logic
stage.addEventListener('click', (e) => {
  e.stopPropagation();
  stage.classList.add('zoomed');
});

document.addEventListener('click', () => {
  stage.classList.remove('zoomed');
});

function createPageElement(data, index) {
  const page = document.createElement('div');
  page.className = 'page' + (index === 0 ? ' cover-page' : '');
  page.dataset.index = index;
  page.dataset.state = 'closed';

  let frontInner = '';
  if (data.cover) {
    frontInner = `
      <div class="cover-content">
        <div>
          <svg class="brand-logo" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
          <div class="main-title">${data.title}</div>
          <div class="sub-title">${data.subtitle}</div>
        </div>
        <div class="author-name">${data.author}</div>
      </div>`;
  } else if (data.isIndex) {
    frontInner = `
      <div>
        <div class="content-title">${data.title}</div>
        <ul class="index-list">
          ${data.items.map(item => `<li class="index-item"><span>${item.name}</span><span>${item.page}</span></li>`).join('')}
        </ul>
      </div>
      <div class="page-footer">
        <span class="page-number">${data.pageNo}</span>
        <span class="flip-hint">പേജ് മറിക്കുക</span>
      </div>`;
  } else {
    frontInner = `
      <div>
        <div class="content-title">${data.title}</div>
        <div class="content-body">${data.content}</div>
      </div>
      <div class="page-footer">
        <span class="page-number">Page 0${index}</span>
      </div>`;
  }

  page.innerHTML = `
    <div class="page-face front-face">${frontInner}</div>
    <div class="page-face back-face"></div>
    <div class="page-shadow"></div>
  `;
  return page;
}

pagesData.forEach((p, i) => stage.appendChild(createPageElement(p, i)));

const pages = Array.from(document.querySelectorAll('.page'));
let activePage = null;
let startX = 0;
let currentRotation = 0;

function updateStack() {
  pages.forEach((page, i) => {
    const isOpen = page.dataset.state === 'open';
    if (isOpen) {
      page.style.zIndex = i + 1;
      page.style.transform = 'rotateY(-180deg)';
    } else {
      page.style.zIndex = (pages.length - i) + 1;
      page.style.transform = 'rotateY(0deg)';
    }
  });
}

pages.forEach((page) => {
  page.addEventListener('pointerdown', (e) => {
    activePage = page;
    startX = e.clientX;
    currentRotation = page.dataset.state === 'open' ? -180 : 0;
    page.style.transition = 'none';
    page.setPointerCapture(e.pointerId);
  });

  page.addEventListener('pointermove', (e) => {
    if (activePage !== page) return;
    const deltaX = e.clientX - startX;
    
    if (page.dataset.state === 'open') {
      currentRotation = -180 + Math.min(180, Math.max(0, deltaX * 0.6));
    } else {
      currentRotation = Math.max(-180, Math.min(0, deltaX * 0.6));
    }

    const shadow = page.querySelector('.page-shadow');
    const bendProgress = Math.abs(currentRotation) / 180;
    const shadowOpacity = Math.sin(bendProgress * Math.PI);
    
    if (shadow) shadow.style.opacity = shadowOpacity * 0.8;
    page.style.transform = `rotateY(${currentRotation}deg)`;
  });

  const handlePointerUp = () => {
    if (activePage !== page) return;
    page.style.transition = 'transform .6s cubic-bezier(.2, .8, .2, 1)';
    const shadow = page.querySelector('.page-shadow');
    if (shadow) shadow.style.opacity = '0';

    if (currentRotation < -90) {
      page.dataset.state = 'open';
    } else {
      page.dataset.state = 'closed';
    }

    activePage = null;
    updateStack();
  };

  page.addEventListener('pointerup', handlePointerUp);
  page.addEventListener('pointercancel', handlePointerUp);
});

updateStack();
</script>

</body>
</html>
