 <!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAS Charity International - Master Ad Template</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    /* ഇവിടെ ബാക്ക്ഗ്രൗണ്ട് കളർ അല്ലെങ്കിൽ ഗ്രാഡിയന്റ് മാറ്റാം */
    background-color: #0b0f19;
    color: #ffffff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .video-container {
    position: relative;
    width: 900px;
    height: 506px;
    background: radial-gradient(circle at center, #1a233a 0%, #080c14 100%);
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(212, 175, 55, 0.15);
    overflow: hidden;
    border: 1px solid rgba(212, 175, 55, 0.3);
  }
  .crystal-container {
    position: absolute;
    top: 45%; left: 50%;
    transform: translate(-50%, -55%);
    width: 240px;
    height: 240px;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: float 5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translate(-50%, -55%) translateY(0px); }
    50% { transform: translate(-50%, -55%) translateY(-10px); }
  }
  /* പ്രിസത്തിന്റെ ബാക്ക്ഗ്രൗണ്ട് / ഷേപ്പ് ഇവിടെ മാറ്റാം */
  .crystal-shape {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(212,175,55,0.05));
    clip-path: polygon(50% 90%, 10% 45%, 10% 25%, 30% 10%, 50% 25%, 70% 10%, 90% 25%, 90% 45%);
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: inset 0 0 15px rgba(255,255,255,0.2);
  }
  /* സ്ഥിരമായി നിൽക്കുന്ന ലോഗോ (കൈയും സ്പൂണും കുട്ടിയുടെ മുഖവും) */
  .fixed-logo {
    position: relative;
    z-index: 2;
    width: 140px;
    height: 140px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }
  .text-content {
    position: absolute;
    bottom: 35px;
    width: 100%;
    text-align: center;
    padding: 0 20px;
  }
  .title {
    font-size: 26px;
    font-weight: 700;
    color: #d4af37;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 16px;
    color: #e0e0e0;
    font-weight: 300;
  }
</style>
</head>
<body>
  <div class="video-container">
    <!-- ബാക്ക്ഗ്രൗണ്ട് പ്രിസം ഡിസൈൻ -->
    <div class="crystal-container">
      <div class="crystal-shape"></div>
      
      <!-- സ്ഥിരമായ ലോഗോ വെബ് ഇമേജ് അല്ലെങ്കിൽ SVG ആയി ഇവിടെ നൽകാം -->
      <svg class="fixed-logo" viewBox="0 0 100 100">
        <!-- നിങ്ങളുടെ ലോഗോ ലൈൻ ആർട്ടുകൾ ഇവിടെ കോഡ് ചെയ്യാം അല്ലെങ്കിൽ ചിത്രം ലിങ്ക് ചെയ്യാം -->
        <path d="M25,50 Q40,30 55,45 T75,40" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- പരസ്യ വാചകങ്ങൾ -->
    <div class="text-content">
      <div class="title">BAS CHARITY INTERNATIONAL</div>
      <div class="subtitle">YOUR PURCHASE SATISFIES A HUNGER</div>
    </div>
  </div>
</body>
</html>
