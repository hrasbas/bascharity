 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>BAS CHARITY INTERNATIONAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
  user-select: none; 
  -webkit-user-select: none; 
}

html, body { 
  width: 100%; 
  height: 100vh; 
  height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle at top, #1e293b 0%, #0f172a 54%, #020617 100%);
  font-family: Georgia, serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 100% Responsive Stage */
.stage {
  position: relative;
  width: min(440px, 85vw);
  height: min(680px, 82vh);
  perspective: 2500px;
  transform-style: preserve-3d;
  touch-action: none;
  transform: translateX(5px) rotateY(-10deg) rotateX(4deg);
}

/* ബാക്ക് കവർ / ബോട്ടം ബേസ് (അടി) */
.back-cover-base {
  position: absolute;
  top: -3mm;
  left: -2mm;
  width: calc(100% + 5mm);
  height: calc(100% + 6mm);
  background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%);
  border: 1.5mm solid #64748b; /* 1.5mm Border Edge */
  border-radius: 4px;
  box-shadow: 
    inset 0 0 20px rgba(0,0,0,.2), 
    -15px 20px 30px rgba(0,0,0,0.5);
  z-index: 0;
}

/* Spine & Stitch Marking (ബൈൻഡിംഗ് തുന്നൽ അടയാളം) */
.spine {
  position: absolute;
  left: -12px;
  top: -3mm;
  width: 12px;
  height: calc(100% + 6mm);
  background: linear-gradient(to right, #334155, #64748b);
  border-left: 2px dashed #94a3b8; /* Stitch Effect */
  border-radius: 4px 0 0 4px;
  z-index: 80;
}

/* Page Setup */
.page {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform .65s cubic-bezier(.25, 1, .5, 1);
  will-change: transform;
  cursor: grab;
  border-right: 1.5mm solid rgba(212, 204, 182, 0.8); /* 1.5mm Page Edge */
  border-top: 1.5mm solid rgba(212, 204, 182, 0.4);
  border-bottom: 1.5mm solid rgba(212, 204, 182, 0.4);
}
.page:active { cursor: grabbing; }

.page-face {
  position: absolute;
  inset: 0;
  padding: 6% 5%;
  background: linear-gradient(135deg, #fffdf8 0%, #f4ede0 100%);
  border: 1px solid #d6ccb6;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.front-face { z-index: 2; }
.back-face { 
  z-index: 1; 
  transform: rotateY(180deg);
  background: #fcfbf7;
}

/* Cover Styling */
.cover-page .front-face {
  background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
  border: 2px solid #94a3b8;
}

.cover-title {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
}

.main-title {
  font-family: 'Arial Black', sans-serif;
  font-size: clamp(16px, 2.5vw, 22px);
  font-weight: 900;
  color: #000;
  text-transform: uppercase;
  margin-top: 10px;
}

.sub-title {
  font-size: clamp(9px, 1.2vw, 11px);
  font-weight: 700;
  color: #334155;
  border-top: 1px solid #000;
  border-bottom: 1px solid #000;
  padding: 4px;
  margin-top: 6px;
}

.author-name {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(18px, 2.5vw, 24px);
  color: #0f172a;
}

/* Content Layout */
.content-title {
  font-size: clamp(12px, 1.5vw, 14px);
  font-weight: 800;
  border-bottom: 2px solid #cbd5e1;
  padding-bottom: 4px;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.content-body {
  font-size: clamp(10px, 1.2vw, 12.5px);
  line-height: 1.45;
  color: #1e293b;
  text-align: justify;
}

.index-list { list-style: none; }
.index-item {
  display: flex;
  justify-content: space-between;
  font-size: clamp(9px, 1.1vw, 11px);
  padding: 3px 0;
  border-bottom: 1px dashed #cbd5e1;
  font-weight: 600;
}

.page-footer {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  font-weight: bold;
  border-top: 1px dashed #cbd5e1;
  padding-top: 4px;
}
</style>
</head>
<body>

<div class="stage" id="bookStage">
  <!-- അടിയിലെ കവർ ബേസ് -->
  <div class="back-cover-base"></div>
  <div class="spine"></div>
</div>

<script>
// Security & Analytics Events Initialization (അടിസ്ഥാന സെക്യൂരിറ്റി സജ്ജീകരണം)
window.addEventListener('DOMContentLoaded', () => {
  console.log("Book System Initialized Securely.");
});

// Security: Prevent basic context menu inspection if required
document.addEventListener('contextmenu', event => event.preventDefault());

const pagesData = [
  {
    cover: true,
    title: 'BAS CHARITY<br>INTERNATIONAL',
    subtitle: 'OFFICIAL POLICY MANUAL',
    author: 'Mohamed Basheer Peringala'
  },
  {
    isIndex: true,
    title: 'INDEX (PART 1)',
    pageNo: 'Page 01',
    items: [
      { name: '01. Welcome', page: 'Page 03' },
      { name: '02. About Us', page: 'Page 04' },
      { name: '03. Founder Message', page: 'Page 05' },
      { name: '04. Vision & Mission', page: 'Page 06' }
    ]
  },
  {
    title: "WELCOME",
    content: "<p>Welcome to BAS Charity International. Thank you for visiting our platform.</p><br><p>Our goal is to connect everyday shopping with charitable giving smoothly and transparently.</p>"
  },
  {
    title: "ABOUT US",
    content: "<p>BAS Charity International is a humanitarian initiative focused on sustainable social progress and transparent operations worldwide.</p>"
  }
];

const stage = document.getElementById('bookStage');

// Dynamic Page Creation
function createPage(data, index) {
  const page = document.createElement('div');
  page.className = 'page' + (data.cover ? ' cover-page' : '');
  page.dataset.index = index;
  page.dataset.state = 'closed';

  let frontHTML = '';
  if (data.cover) {
    frontHTML = `
      <div class="cover-title">
        <div>
          <div class="main-title">${data.title}</div>
          <div class="sub-title">${data.subtitle}</div>
        </div>
        <div class="author-name">${data.author}</div>
      </div>`;
  } else if (data.isIndex) {
    frontHTML = `
      <div>
        <div class="content-title">${data.title}</div>
        <ul class="index-list">
          ${data.items.map(item => `<li class="index-item"><span>${item.name}</span><span>${item.page}</span></li>`).join('')}
        </ul>
      </div>
      <div class="page-footer"><span>${data.pageNo}</span></div>`;
  } else {
    frontHTML = `
      <div>
        <div class="content-title">${data.title}</div>
        <div class="content-body">${data.content}</div>
      </div>
      <div class="page-footer"><span>Page 0${index}</span></div>`;
  }

  page.innerHTML = `
    <div class="page-face front-face">${frontHTML}</div>
    <div class="page-face back-face"></div>
  `;
  return page;
}

// Render Pages
pagesData.forEach((data, i) => stage.appendChild(createPage(data, i)));

const pages = Array.from(document.querySelectorAll('.page'));
let startX = 0;
let activePage = null;

function updateZIndex() {
  pages.forEach((page, i) => {
    if (page.dataset.state === 'open') {
      page.style.zIndex = i + 1;
      page.style.transform = 'rotateY(-180deg)';
    } else {
      page.style.zIndex = pages.length - i;
      page.style.transform = 'rotateY(0deg)';
    }
  });
}

// Drag / Swipe Controls
pages.forEach(page => {
  page.addEventListener('pointerdown', e => {
    activePage = page;
    startX = e.clientX || (e.touches && e.touches[0].clientX);
    page.style.transition = 'none';
  });

  page.addEventListener('pointermove', e => {
    if (!activePage || activePage !== page) return;
    const currentX = e.clientX || (e.touches && e.touches[0].clientX);
    const diffX = currentX - startX;
    
    if (page.dataset.state === 'closed') {
      let deg = Math.max(-180, Math.min(0, diffX * 0.6));
      page.style.transform = `rotateY(${deg}deg)`;
    } else {
      let deg = -180 + Math.max(0, Math.min(180, diffX * 0.6));
      page.style.transform = `rotateY(${deg}deg)`;
    }
  });

  const handleRelease = e => {
    if (!activePage || activePage !== page) return;
    page.style.transition = 'transform 0.5s ease';
    
    const endX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
    const diffX = endX - startX;

    if (page.dataset.state === 'closed' && diffX < -50) {
      page.dataset.state = 'open';
    } else if (page.dataset.state === 'open' && diffX > 50) {
      page.dataset.state = 'closed';
    }

    activePage = null;
    updateZIndex();
  };

  page.addEventListener('pointerup', handleRelease);
  page.addEventListener('pointercancel', handleRelease);
});

// Initial Layer Stack Setup
updateZIndex();
</script>
</body>
</html>
