 <!-- ========================================== -->
<!-- 1. CSS STYLES (ഡിസൈനും 3D അനിമേഷനും) -->
<!-- ========================================== -->
<style>
  /* പ്രധാന കൊടി (Right Side Wrapper) */
  .flag-cloth-container {
    position: fixed;
    right: 0;
    bottom: 0px; 
    z-index: 9997;
    display: flex;
    flex-direction: column;
    gap: 0.5px; /* ആവശ്യപ്പെട്ട ചെറിയ gap (0.5px) */
    
    transform-origin: right center;
    perspective: 1200px;
    
    /* ഉയർന്ന 3D Flexible എഫക്റ്റോടെയുള്ള പൂർണ്ണ അനിമേഷൻ */
    animation: superFlexibleClothWave 2s infinite ease-in-out alternate;
  }

  /* കൊടിയുടെ സ്ട്രിപ്പുകൾ (Segments) */
  .flag-segment {
    position: relative;
    width: 4cm;   
    height: 3cm;  
    border: none;
    cursor: pointer;
    box-shadow: -4px 2px 8px rgba(0, 0, 0, 0.3);
    
    writing-mode: horizontal-tb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 26px;
    text-align: center;
    line-height: 1.1;
    padding: 0 8px;
    
    transform-origin: right center;
    transition: filter 0.2s ease;
  }

  /* 🧵 നൂല് കൊണ്ട് ബന്ധിപ്പിച്ചത് പോലെയുള്ള തുന്നൽ ഡിസൈൻ (Stitch Line Effect) */
  .flag-segment::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 10px;
    right: 10px;
    height: 1px;
    border-bottom: 2px dashed rgba(0, 0, 0, 0.35); /* തുന്നൽ വരികൾ */
    z-index: 10;
  }

  .flag-red::after {
    display: none; /* ഏറ്റവും താഴത്തെ ഭാഗത്ത് തുന്നൽ വരി വേണ്ട */
  }

  /* മുകൾവശം (Sky Blue) */
  .flag-skyblue {
    background: linear-gradient(135deg, #87CEEB, #00BFFF);
    color: #000000;
    border-radius: 12px 0 0 0;
    text-shadow: 0px 0px 2px rgba(255, 255, 255, 0.8);
    /* തുണിക്ക് കൂടുതൽ ഫ്ലെക്സിബിലിറ്റി തോന്നിപ്പിക്കാൻ സമയം മാറ്റി പാറ്റേൺ അനിമേഷൻ നൽകുന്നു */
    animation: segmentFlex 2s infinite ease-in-out alternate;
  }

  /* നടുഭാഗം (White) */
  .flag-white {
    background: linear-gradient(135deg, #ffffff, #f0f0f0);
    color: #000000;
    text-shadow: 0px 0px 1px rgba(0, 0, 0, 0.2);
    animation: segmentFlex 2s infinite ease-in-out alternate;
    animation-delay: 0.15s; /* ചെറിയ delay നൽകിയാൽ ഒറിജിനൽ തുണിപോലെ വളയും */
  }

  /* താഴ്ഭാഗം (Red) */
  .flag-red {
    background: linear-gradient(135deg, #ff3d00, #dd2c00);
    color: #ffffff;
    border-radius: 0 0 0 12px;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    animation: segmentFlex 2s infinite ease-in-out alternate;
    animation-delay: 0.3s;
  }

  .flag-segment:hover,
  .flag-segment:active {
    filter: brightness(1.08);
  }

  /* പ്രധാന 3D അനിമേഷൻ (മുമ്പ് ഉണ്ടായിരുന്ന ഫുൾ ഫ്ലെക്സിബിൾ മൂവ്മെന്റ്) */
  @keyframes superFlexibleClothWave {
    0% {
      transform: rotateY(0deg) rotateZ(0deg) skewY(0deg) translateY(0px);
    }
    25% {
      transform: rotateY(-35deg) rotateZ(3deg) skewY(6deg) translateY(-8px);
    }
    50% {
      transform: rotateY(20deg) rotateZ(-2deg) skewY(-4deg) translateY(5px);
    }
    75% {
      transform: rotateY(-40deg) rotateZ(4deg) skewY(7deg) translateY(-10px);
    }
    100% {
      transform: rotateY(0deg) rotateZ(0deg) skewY(0deg) translateY(0px);
    }
  }

  /* ഓരോ പീസും ഒന്നിച്ച് ബന്ധിക്കപ്പെട്ട് ഫ്ലെക്സിബിളായി വേവ് ചെയ്യാനുള്ള സബ് അനിമേഷൻ */
  @keyframes segmentFlex {
    0% {
      transform: skewX(0deg);
    }
    50% {
      transform: skewX(-2deg);
    }
    100% {
      transform: skewX(2deg);
    }
  }
</style>


<!-- ========================================== -->
<!-- 2. HTML STRUCTURE (കൊടിയുടെ ഭാഗങ്ങൾ) -->
<!-- ========================================== -->
<div class="flag-cloth-container">
  <!-- Sky Blue - Change Language -->
  <button class="flag-segment flag-skyblue" onclick="handleLangClick()">Change Language</button>
  
  <!-- White - Change Country -->
  <button class="flag-segment flag-white" onclick="handleCountryClick()">Change Country</button>
  
  <!-- Red - Change Category -->
  <button class="flag-segment flag-red" onclick="handleCategoryClick()">Change Category</button>
</div>
