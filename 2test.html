 <!DOCTYPE html>
<html lang="en">
<head>

<!-- 001 -->
<meta charset="UTF-8">

<!-- 002 -->
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<!-- 003 -->
<title>BAS Charity — Shopping + Charity</title>

<!-- 004 -->
<meta name="theme-color" content="#080b0f">

<style>

/* =========================================================
   005 — PAGE
   ========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#05070a;
  color:#ffffff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}


/* =========================================================
   006 — PHONE SCREEN
   ========================================================= */

#basPremiumPhone{
  width:min(92%,390px);
  min-height:100vh;

  margin:0 auto;
  padding:18px 16px 25px;

  background:
    linear-gradient(
      145deg,
      #18212b 0%,
      #07090c 55%,
      #1b2229 100%
    );

  border-left:2px solid #aeb4bc;
  border-right:2px solid #aeb4bc;

  box-shadow:
    0 0 18px rgba(220,225,230,.18),
    inset 0 0 25px rgba(255,255,255,.03);

  text-align:center;
}


/* =========================================================
   007 — HEADER
   ========================================================= */

.basPhoneHeader{
  padding:15px 4px 8px;
}

.basPhoneBrand{
  color:#ffffff;

  font-size:
    clamp(18px,5vw,23px);

  font-weight:900;

  letter-spacing:.8px;

  line-height:1.25;
}

.basPhoneHub{
  margin-top:7px;

  color:#aeb7c2;

  font-size:11px;

  font-weight:700;

  letter-spacing:2px;
}


/* =========================================================
   008 — SMALL LOGO
   ========================================================= */

.basPhoneLogoBtn{

  display:block;

  width:105px;
  height:105px;

  margin:15px auto 10px;

  padding:5px;

  border:0 !important;

  background:transparent !important;

  box-shadow:none !important;

  cursor:pointer;

  appearance:none;
}

.basPhoneLogo{

  width:100%;
  height:100%;

  object-fit:contain;

  display:block;

  border:0 !important;

  background:transparent;
}


/* =========================================================
   009 — MAIN MESSAGE
   ========================================================= */

.basPhoneMessage{

  margin:8px 0 18px;

  padding:19px 10px;

  border-radius:21px;

  background:
    linear-gradient(
      145deg,
      #202832,
      #11161b
    );

  border:1px solid #aeb4bc;

  box-shadow:
    0 0 8px rgba(174,180,188,.20),
    inset 0 0 12px rgba(255,255,255,.04);
}

.basPhoneMain{

  color:#ffffff;

  font-size:
    clamp(20px,6vw,27px);

  line-height:1.16;

  font-weight:900;
}

.basPhoneSub{

  margin-top:12px;

  color:#d7dce2;

  font-size:14px;

  letter-spacing:2px;

  font-weight:800;
}


/* =========================================================
   010 — BUTTON COMMON
   ========================================================= */

.basPhoneAction{

  width:100%;

  min-height:56px;

  margin:9px 0;

  padding:10px 12px;

  border-radius:17px !important;

  border:1px solid #bfc4c9 !important;

  font-family:Arial,Helvetica,sans-serif;

  font-size:18px;

  font-weight:900;

  cursor:pointer;

  transition:
    transform .16s ease,
    filter .16s ease,
    box-shadow .16s ease;

  appearance:none;
}


/* =========================================================
   011 — SHOP NOW
   ========================================================= */

.basShopAction{

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #dce2e7
    ) !important;

  color:#10151a !important;

  box-shadow:
    0 0 9px rgba(255,255,255,.25);
}


/* =========================================================
   012 — SAVE ICON
   ========================================================= */

.basSaveAction{

  background:
    linear-gradient(
      145deg,
      #5b6066,
      #292d32
    ) !important;

  color:#ffffff !important;
}


/* =========================================================
   013 — OPEN WEBSITE
   ========================================================= */

.basOpenAction{

  background:
    linear-gradient(
      145deg,
      #3f444a,
      #171a1e
    ) !important;

  color:#ffffff !important;
}


/* =========================================================
   014 — TOUCH EFFECT
   ========================================================= */

.basPhoneAction:active{

  transform:scale(.97) !important;

  filter:brightness(1.15);
}

.basPhoneLogoBtn:active{

  transform:scale(.96);
}


/* =========================================================
   015 — FOOTER
   ========================================================= */

.basPhoneFooter{

  margin-top:16px;

  color:#9fa8b2;

  font-size:10px;

  font-weight:700;

  letter-spacing:1px;

  line-height:1.5;
}


/* =========================================================
   016 — SMALL PHONE
   ========================================================= */

@media(max-width:350px){

  #basPremiumPhone{

    width:96%;

    padding:
      14px 12px 22px;
  }

  .basPhoneLogoBtn{

    width:88px;
    height:88px;
  }

  .basPhoneMain{

    font-size:19px;
  }

  .basPhoneAction{

    min-height:51px;

    font-size:16px;
  }
}

</style>
</head>


<body>


<!-- =========================================================
     017 — BAS CHARITY PREMIUM PHONE
     ========================================================= -->

<div id="basPremiumPhone">


  <!-- 018 — BRAND -->
  <div class="basPhoneHeader">

    <div class="basPhoneBrand">
      BAS CHARITY INTERNATIONAL™
    </div>

    <div class="basPhoneHub">
      AN INTERNATIONAL SHOPPING HUB
    </div>

  </div>


  <!-- =======================================================
       019 — LOGO
       LOGO CLICK → SHOPPING
       ======================================================= -->

  <button
    id="basPhoneLogoBtn"
    class="basPhoneLogoBtn"
    type="button"
    aria-label="Open Shopping">

    <img
      src="bas-diamond-hands-sticker.png"
      alt="BAS Charity"
      class="basPhoneLogo">

  </button>


  <!-- =======================================================
       020 — MAIN MESSAGE
       ======================================================= -->

  <div class="basPhoneMessage">

    <div class="basPhoneMain">

      YOUR PURCHASE<br>
      SATISFIES A HUNGER™

    </div>

    <div class="basPhoneSub">

      SHOPPING + CHARITY

    </div>

  </div>


  <!-- =======================================================
       021 — SHOP NOW
       ======================================================= -->

  <button
    id="basPhoneShopBtn"
    class="basPhoneAction basShopAction"
    type="button">

    🛒 &nbsp; SHOP NOW

  </button>


  <!-- =======================================================
       022 — SAVE THIS ICON
       ======================================================= -->

  <button
    id="basPhoneSaveBtn"
    class="basPhoneAction basSaveAction"
    type="button">

    📲 &nbsp; SAVE THIS ICON

  </button>


  <!-- =======================================================
       023 — OPEN BASCHARITY.COM
       ======================================================= -->

  <button
    id="basPhoneOpenBtn"
    class="basPhoneAction basOpenAction"
    type="button">

    🌐 &nbsp; OPEN BASCHARITY.COM

  </button>


  <!-- =======================================================
       024 — FOOTER
       ======================================================= -->

  <div class="basPhoneFooter">

    50,000+ SHOPS • WORLDWIDE • ALL LANGUAGES

  </div>


</div>


<script>

/* =========================================================
   025 — LOGO CLICK → SHOPPING
   ========================================================= */

(function(){

  "use strict";


  const logoBtn =
    document.getElementById("basPhoneLogoBtn");


  if(logoBtn){

    logoBtn.addEventListener(
      "click",
      function(){

        /*
         * Standalone Test version:
         * logo click opens the Shopping section.
         */

        const shopSection =
          document.getElementById("shopSection");


        if(shopSection){

          shopSection.scrollIntoView({
            behavior:"smooth",
            block:"start"
          });

        }else{

          alert("SHOPPING");

        }

      }
    );

  }


  /* =======================================================
     026 — SHOP NOW
     ======================================================= */

  const shopBtn =
    document.getElementById("basPhoneShopBtn");


  if(shopBtn){

    shopBtn.addEventListener(
      "click",
      function(){

        /*
         * Standalone Test:
         * ഇവിടെ ഇപ്പോൾ Shopping test action.
         */

        const shopSection =
          document.getElementById("shopSection");


        if(shopSection){

          shopSection.scrollIntoView({
            behavior:"smooth",
            block:"start"
          });

        }else{

          alert("SHOPPING");

        }

      }
    );

  }


  /* =======================================================
     027 — SAVE THIS ICON
     ======================================================= */

  const saveBtn =
    document.getElementById("basPhoneSaveBtn");


  if(saveBtn){

    saveBtn.addEventListener(
      "click",
      function(){

        /*
         * Standalone Test version:
         * Browser PWA install prompt ലഭിച്ചാൽ ഉപയോഗിക്കും.
         */

        if(
          window.basPrompt &&
          typeof window.basPrompt.prompt === "function"
        ){

          window.basPrompt.prompt();

          return;

        }


        /*
         * Prompt ഇല്ലെങ്കിൽ test message.
         */

        alert(
          "Use your browser menu → Add to Home Screen / Install"
        );

      }
    );

  }


  /* =======================================================
     028 — OPEN WEBSITE
     ======================================================= */

  const openBtn =
    document.getElementById("basPhoneOpenBtn");


  if(openBtn){

    openBtn.addEventListener(
      "click",
      function(){

        window.open(
          "https://bascharity.com",
          "_blank",
          "noopener,noreferrer"
        );

      }
    );

  }


})();


/* =========================================================
   029 — PWA INSTALL PROMPT FOR TEST
   ========================================================= */

window.basPrompt = null;


window.addEventListener(
  "beforeinstallprompt",
  function(e){

    e.preventDefault();

    window.basPrompt = e;

  }
);

</script>


</body>
</html>
