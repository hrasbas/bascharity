 <!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Website</title>
  
  <!-- ALL CSS STYLES IN ONE PLACE -->
  <style>
    /* ---- 1. FLOATING FLAGS (LEFT SIDE) ---- */
    .floating-flags-container {
      position: fixed;
      left: 0;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      gap: 11px; /* 3mm gap */
      z-index: 9997;
    }

    .flag-btn {
      width: 30px; /* 0.8 cm */
      height: 113px; /* 3 cm */
      border: none;
      cursor: pointer;
      box-shadow: 3px 3px 8px rgba(0,0,0,0.3);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 2px;
      border-radius: 0 10px 10px 0;
      animation: flagWaveFloat 2.5s infinite ease-in-out;
      transform-origin: left center;
      transition: width 0.3s;
    }

    .flag-btn:hover, .flag-btn:active {
      width: 45px;
    }

    .flag-lang {
      background-color: #007bff; /* നീല */
      color: white;
      animation-delay: 0s;
    }

    .flag-country {
      background-color: #ffffff; /* വെള്ള */
      color: black;
      border: 1px solid #e0e0e0;
      border-left: none;
      animation-delay: 0.3s;
    }

    .flag-category {
      background-color: #ff3d00; /* ചുവപ്പ് */
      color: white;
      animation-delay: 0.6s;
    }

    @keyframes flagWaveFloat {
      0%, 100% {
        transform: perspective(200px) rotateY(0deg) translateY(0px) skewY(0deg);
      }
      50% {
        transform: perspective(200px) rotateY(18deg) translateY(-5px) skewY(-3deg);
      }
    }

    /* ---- 2. RIGHT SIDE SCROLL CONTROLLER ---- */
    .scroll-trigger-btn {
      position: fixed;
      right: 0;
      bottom: 120px;
      z-index: 9999;
      width: 32px;
      height: 48px;
      background-color: #00e676;
      border-radius: 8px 0 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: -2px 2px 8px rgba(0,0,0,0.3);
      animation: blinkGlow 1.5s infinite alternate;
      border: none;
    }

    @keyframes blinkGlow {
      0% { background-color: #00e676; box-shadow: 0 0 5px #00e676; }
      100% { background-color: #00a843; box-shadow: 0 0 15px #00e676; }
    }

    .scroll-trigger-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .scroll-panel {
      position: fixed;
      right: -100px;
      bottom: 120px;
      z-index: 9998;
      width: 50px;
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 25px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: -2px 4px 15px rgba(0,0,0,0.4);
      transition: right 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .scroll-panel.open {
      right: 12px;
    }

    .scroll-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .scroll-btn.locked {
      background: #ff3d00;
      border-color: #ff3d00;
    }

    .speed-slider-container {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .speed-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 60px;
      height: 4px;
      background: #444;
      border-radius: 2px;
      transform: rotate(-90deg);
      cursor: pointer;
    }

    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00e676;
    }
  </style>
</head>
<body>

  <!-- 1. LEFT SIDE FLAGS -->
  <div class="floating-flags-container">
    <button class="flag-btn flag-lang">ഭാഷ</button>
    <button class="flag-btn flag-country">COUNTRY</button>
    <button class="flag-btn flag-category">CATEGORY</button>
  </div>

  <!-- 2. RIGHT SIDE SCROLL TRIGGER -->
  <button class="scroll-trigger-btn" id="scrollTrigger">
    <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
  </button>

  <!-- 3. RIGHT SIDE SCROLL PANEL -->
  <div class="scroll-panel" id="scrollPanel">
    <button class="scroll-btn" id="btnUp">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="white"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
    </button>
    <div class="speed-slider-container">
      <input type="range" id="speedBar" class="speed-slider" min="1" max="10" value="3">
    </div>
    <button class="scroll-btn" id="btnLock">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="white"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
    </button>
    <button class="scroll-btn" id="btnDown">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="white"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
    </button>
  </div>

  <!-- ALL JAVASCRIPT LOGIC IN ONE PLACE -->
  <script>
    const trigger = document.getElementById('scrollTrigger');
    const panel = document.getElementById('scrollPanel');
    const btnUp = document.getElementById('btnUp');
    const btnDown = document.getElementById('btnDown');
    const btnLock = document.getElementById('btnLock');
    const speedBar = document.getElementById('speedBar');

    let scrollInterval = null;
    let isLocked = false;

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      panel.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!panel.contains(e.target) && !trigger.contains(e.target)) {
        panel.classList.remove('open');
      }
    });

    function startContinuousScroll(direction) {
      stopContinuousScroll();
      const speed = parseInt(speedBar.value) * 3;
      scrollInterval = setInterval(() => {
        window.scrollBy({ top: direction * speed, behavior: 'instant' });
      }, 16);
    }

    function stopContinuousScroll() {
      if (scrollInterval) clearInterval(scrollInterval);
    }

    btnUp.addEventListener('mousedown', () => startContinuousScroll(-1));
    btnUp.addEventListener('mouseup', stopContinuousScroll);
    btnUp.addEventListener('mouseleave', stopContinuousScroll);
    btnUp.addEventListener('touchstart', (e) => { e.preventDefault(); startContinuousScroll(-1); });
    btnUp.addEventListener('touchend', stopContinuousScroll);

    btnDown.addEventListener('mousedown', () => startContinuousScroll(1));
    btnDown.addEventListener('mouseup', stopContinuousScroll);
    btnDown.addEventListener('mouseleave', stopContinuousScroll);
    btnDown.addEventListener('touchstart', (e) => { e.preventDefault(); startContinuousScroll(1); });
    btnDown.addEventListener('touchend', stopContinuousScroll);

    btnLock.addEventListener('click', () => {
      isLocked = !isLocked;
      btnLock.classList.toggle('locked', isLocked);
      document.body.style.overflow = isLocked ? 'hidden' : '';
    });
  </script>
</body>
</html>
