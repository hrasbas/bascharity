 <!-- ========================================== -->
<!-- 1. CSS STYLES (ഡിസൈനും അനിമേഷനും) -->
<!-- ========================================== -->
<style>
  /* 3 ബട്ടണുകളും ഉൾപ്പെടുന്ന പ്രധാന കൊടി (Flag Wrapper) */
  .flag-cloth-container {
    position: fixed;
    right: 0; /* വലതുവശത്തേക്ക് മാറ്റാൻ right: 0 നൽകുക */
    bottom: 1px; 
    z-index: 9997;
    display: flex;
    flex-direction: column;
    gap: 3mm;
    
    transform-origin: right bottom; /* അനിമേഷൻ റൈറ്റ് വശത്ത് നിന്ന് തുടങ്ങാൻ */
    animation: realFlagWaveRight 2s infinite ease-in-out;
  }

  /* കൊടിയുടെ ബട്ടൺ ഡിസൈൻ */
  .flag-segment {
    width: 4cm;  
    height: 3cm;   
    border: none;
    cursor: pointer;
    box-shadow: -2px 2px 6px rgba(0, 0, 0, 0.3);
    writing-mode: horizontal-tb;
    text-orientation: mixed;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px; 
    letter-spacing: 1px;
    
    /* വളഞ്ഞ വശം ഇടതുവശത്തേക്ക് ആക്കാൻ (Left side rounded) */
    border-radius: 8px 0 0 8px;
    transition: width 0.2s ease;
  }

  .flag-segment:active,
  .flag-segment:hover {
    width:4.1cm;
  }

  .flag-blue {
    background-color: #007bff;
    color: #87CEFA;
  }

  .flag-white {
    background-color: #ffffff;
    color: #000000;
    border: 1px solid #dcdcdc;
    border-right: none;
  }

  .flag-red {
    background-color: #ff3d00;
    color: #ffffff;
  }

  /* വലതുവശത്തിരിക്കുമ്പോൾ കൊടി പാറാനുള്ള അനിമേഷൻ */
  @keyframes realFlagWaveRight {
    0% {
      transform: perspective(300px) rotateY(0deg) skewY(0deg) translateY(0px);
    }
    25% {
      transform: perspective(300px) rotateY(-25deg) skewY(5deg) translateY(-6px);
    }
    50% {
      transform: perspective(300px) rotateY(15deg) skewY(-4deg) translateY(4px);
    }
    75% {
      transform: perspective(300px) rotateY(-30deg) skewY(6deg) translateY(-8px);
    }
    100% {
      transform: perspective(300px) rotateY(0deg) skewY(0deg) translateY(0px);
    }
  }
</style>


<!-- ========================================== -->
<!-- 2. HTML STRUCTURE (കൊടിയുടെ ഭാഗങ്ങൾ) -->
<!-- ========================================== -->
<div class="flag-cloth-container">
  <button class="flag-segment flag-blue" onclick="handleLangClick()">ഭാഷ</button>
  <button class="flag-segment flag-white" onclick="handleCountryClick()">Country</button>
  <button class="flag-segment flag-red" onclick="handleCategoryClick()">Category</button>
</div>


<!-- ========================================== -->
<!-- 3. JAVASCRIPT (ഫങ്ഷനുകൾ) -->
<!-- ========================================== -->

  function handleLangClick() {
    console.log("Language button clicked");
  }

  function handleCountryClick() {
    console.log("Country button clicked");
  }

  function handleCategoryClick() {
    console.log("Category button clicked");
  }
</script>
