<script async src="https://www.googletagmanager.com/gtag/js?id=G-W0NH1KVHHC"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());

function basTrack(eventName, params={}){
  gtag('event',eventName,params);
}

window.addEventListener("load",function(){
  basTrack("page_loaded");
});

document.addEventListener("click",function(e){
  const shop=e.target.closest("a.shopCard");
  if(shop){
    basTrack("shop_click",{
      shop_name:shop.innerText.trim(),
      shop_url:shop.href
    });
  }
});

document.addEventListener("click",function(e){
  const btn=e.target.closest(".compare-btn");
  if(btn){ basTrack("compare_click"); }
});

document.addEventListener("click",function(e){
  const share=e.target.closest(".share-grid a");
  if(share){
    basTrack("share_click",{ platform:share.href });
  }
});

function analyticsCopyLink(){ basTrack("copy_link"); }
function analyticsCountry(country){ basTrack("country_selected",{ country:country }); }
function analyticsLanguage(language){ basTrack("language_selected",{ language:language }); }
function analyticsSearch(text){ basTrack("search",{ search_term:text }); }
function analyticsPWA(){ basTrack("pwa_install"); }
function analyticsDonation(name){ basTrack("donation_button",{ charity:name }); }
function analyticsExternal(url){ basTrack("external_link",{ url:url }); }
function analyticsAffiliate(shopName, url){
  basTrack("affiliate_click", {
    shop: shopName,
    url: url
  });
}

document.addEventListener("click", function(e){
  const card = e.target.closest(".shopCard");
  if (!card) return;

  const shopName = card.querySelector(".shopName")?.innerText || "unknown";

  const shop = typeof shopsArray !== "undefined" ? shopsArray.find(s => s.n === shopName) : null;
  if (!shop) return;

  if ((shop.a || "").trim() === "") {
     analyticsExternal(shop.u);
  } else {
   analyticsAffiliate(shopName, shop.u);
  }
});
</script>
