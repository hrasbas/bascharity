 <!DOCTYPE html>

<style>
/* പേജിലെ എല്ലാ അനാവശ്യ സെലക്ഷനും തടയാൻ */
* {
  -webkit-user-select: none !important;
  -moz-user-select: none !important;
  -ms-user-select: none !important;
  user-select: none !important;
  -webkit-tap-highlight-color: transparent !important;
}

/* സെർച്ച് ബാറുകൾ സാധാരണ പോലെ പ്രവർത്തിക്കാൻ */
input, textarea {
  -webkit-user-select: auto !important;
  -moz-user-select: auto !important;
  -ms-user-select: auto !important;
  user-select: auto !important;
}

/* Standard Responsive Base */
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-size: 19px;
}

<style>
/* CODE NO:1 — RESPONSIVE HEADER BASE */
h1 {
  color:#fff !important;
}

.english-fix {
  color:#bbb !important;
}

#dedication-text {
  color:#bbb !important;
  font-weight:300;
  line-height:1.6;
}

#gallery {
  display:flex;
  overflow-x:auto;
  scroll-behavior:smooth;
  gap:10px;
}

#gallery::-webkit-scrollbar {
  display:none;
}

.card {
  min-width:180px;
  flex-shrink:0;
}

.card img {
  width:100%;
  height:auto;
  border-radius:10px;
  display:block;
}

#gallery.zoom {
  transform:scale(1.05);
  transition:0.3s;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;
  background:#050505;
  font-family:Georgia, serif;
  color:#fff;
  overflow-x:hidden;
  padding-top:clamp(24px, 4vh, 48px);
}

/* Main containers */
.bas-dedication,
.lang-box,
.country-box,
.shop-container,
.compare-container,
.share-container,
.mainbox,
.info-box,
.bas7-wrapper,
.trust-container,
.peace-wrapper,
.vada-wrapper,
.vision-wrapper,
#bas-mega-portal {
  max-width:900px;
  width:96%;
  margin-left:auto;
  margin-right:auto;
}

/* Header */
.header-box {
  display:flex;
  flex-direction:column;
  align-items:center;
  background:#000;
  padding-top:clamp(15px, 3vw, 25px);
  width:100%;
  max-width:100%;
}

#logo-space {
  width:100%;
  height:clamp(220px, 56vw, 340px);
  max-width:100%;
  overflow:hidden;
}

.heading {
  width:100%;
  max-width:100%;
  text-align:center;
  padding:clamp(10px, 3vw, 20px);
  overflow:hidden;
}

/* FOOD WITHOUT SPENDING MONEY */
.food {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(8px, 2vw, 14px);
  margin-bottom:clamp(16px, 4vw, 32px);
  font-family:Georgia,serif;
  font-size:clamp(18px, 4vw, 30px);
  font-weight:400;
  letter-spacing:1px;
  text-transform:uppercase;

  background:linear-gradient(
    180deg,
    #8b6914 0%,
    #d4af37 22%,
    #fff1a8 42%,
    #ffd75a 50%,
    #d4af37 68%,
    #8b6914 100%
  );

  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;

  text-shadow:
    0 1px 1px rgba(255,235,150,.45),
    0 2px 2px rgba(80,50,0,.35);
}

.food::before,
.food::after {
  content:"";
  width:clamp(25px, 6vw, 55px);
  height:2px;
  flex:0 1 auto;
  background:linear-gradient(
    to right,
    transparent,
    #b8860b,
    #ffd700,
    #fff1a8
  );
  box-shadow:0 0 5px rgba(255,215,0,.55);
}

.food::after {
  background:linear-gradient(
    to left,
    transparent,
    #b8860b,
    #ffd700,
    #fff1a8
  );
}

/* BAS CHARITY */
.brand {
  width:100%;
  max-width:100%;
  font-size:clamp(32px, 8vw, 65px);
  font-weight:900;
  line-height:1.05;
  color:#ffffff;
  text-align:center;
  overflow-wrap:break-word;
  word-break:normal;

  text-shadow:
    1px 1px 0 #eeeeee,
    2px 2px 0 #d0d0d0,
    3px 3px 0 #b5b5b5,
    4px 4px 0 #999999,
    5px 5px 0 #7d7d7d,
    6px 6px 0 #626262,
    7px 7px 0 #484848,
    8px 8px 0 #303030,
    10px 10px 0 #1c1c1c,
    13px 14px 18px rgba(0,0,0,.95),
    0 0 22px rgba(255,255,255,.35);
}
 
/* 200 */
  vertical-align:super;
  margin-left:3px;
  color:#ffffff;
  text-shadow:none !important;
  filter:none;
}

/* 201 */
.hub {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(8px, 2vw, 14px);
  margin-top:10px;
  font-family:Arial,sans-serif;
  font-size:clamp(18px, 3vw, 25px);
  font-weight:400;
  letter-spacing:clamp(1px, 0.35vw, 3px);
  color:#d7dce5;
  text-transform:uppercase;
  text-shadow:0 1px 0 #ffffff;
}

/* 202 */
.hub::before,
.hub::after {
  content:"";
  width:clamp(25px, 6vw, 55px);
  height:2px;
  flex:0 1 auto;
  background:linear-gradient(
    to right,
    transparent,
    #7ddcff,
    #d7dce5
  );
  box-shadow:0 0 5px rgba(125,220,255,.45);
}

/* 203 */
.hub::after {
  background:linear-gradient(
    to left,
    transparent,
    #7ddcff,
    #d7dce5
  );
}

/* 204 */
.top-bar {
  background:#111;
  padding:15px 8px;
  border-top:1px solid #333;
  width:100%;
  max-width:100%;
  box-sizing:border-box;
}

/* 205 */
.lang-buttons {
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:10px;
  max-width:600px;
  width:100%;
  margin:auto;
}

/* 206 */
.lang-btn {
  padding:10px 2px;
  min-width:0;
  border:none;
  border-radius:20px;
  font-size:clamp(12px, 1.8vw, 14px);
  font-weight:bold;
  cursor:pointer;
  color:#fff;
  box-sizing:border-box;
  overflow-wrap:break-word;
}

/* 207 */
.en { background:#007BFF; }
.hi { background:#FF9933; color:#000; }
.ml { background:#00C853; }
.ar { background:#2E7D32; }
.ta { background:#C62828; }
.ur { background:#6A1B9A; }
.es { background:#F4C430; color:#000; }
.pt { background:#1B5E20; }

/* 208 */
.google-row {
  text-align:center;
  font-size:clamp(12px, 1.8vw, 14px);
  margin-top:15px;
  color:#bbb;
  max-width:100%;
  overflow-wrap:break-word;
}

/* 209 */
.bas-dedication {
  width:100%;
  max-width:900px;
  text-align:center;
  margin:10px auto 30px auto;
  padding:0 20px;
  font-size:clamp(18px, 3.5vw, 30px);
  font-weight:900;
  font-style:italic;
  color:#6B7280;
  line-height:1.8;
  margin-bottom:1.5cm;
  box-sizing:border-box;
  overflow-wrap:break-word;
}

/* 210 */
.lang-box {
  margin:0 auto 28px;
  padding:0;
  background:transparent;
  border:none;
  text-align:center;
  width:100%;
  max-width:900px;
  box-sizing:border-box;
}

/* 211 */
.lang-title {
  background:#3e464f;
  color:#fff;
  font-weight:900;
  text-align:center;
  padding:10px 20px;
  border:2px solid #AEB7C2;
  border-radius:12px;
  box-shadow:0 0 6px #AEB7C2;
  margin:0 auto 22px;
  max-width:100%;
  box-sizing:border-box;
  overflow-wrap:break-word;
}

/* 212 */
.msg-container {
  width:96%;
  max-width:900px;
  padding:20px 0;
  margin:auto;
  box-sizing:border-box;
}

/* 213 */
.question-box {
  margin:0 auto;
  width:96%;
  max-width:900px;
  background:#000;
  color:#00BFFF;
  padding:clamp(15px, 3vw, 25px);
  border-radius:12px;
  border:1px solid #00BFFF;
  text-align:center;
  line-height:1.8;
  box-sizing:border-box;
  overflow-wrap:break-word;
}

/* 214 */
.english-text {
  font-size:clamp(15px, 2.2vw, 19px);
  font-weight:500;
  display:block;
  max-width:100%;
  overflow-wrap:break-word;
}

/* 215 */
.hunger-footer {
  text-align:center;
  color:#FFD700;
  font-weight:bold;
  font-size:clamp(12px, 1.8vw, 14px);
  margin-top:15px;
  letter-spacing:1px;
  max-width:100%;
  overflow-wrap:break-word;
}

/* 216 */
#install-div {
  display:none;
  position:fixed;
  bottom:clamp(15px, 3vw, 25px);
  right:clamp(15px, 3vw, 25px);
  z-index:10000;
  max-width:calc(100vw - 30px);
}

/* 217 */
#install-btn {
  background:#ff9800;
  color:#fff;
  border:none;
  padding:12px 24px;
  border-radius:50px;
  font-size:clamp(14px, 2vw, 16px);
  font-weight:bold;
  box-shadow:0 4px 15px rgba(0,0,0,0.4);
  cursor:pointer;
  max-width:100%;
  box-sizing:border-box;
}

/* 218 */
#basBalloonWrap {
  position:fixed;
  bottom:0;
  left:0;
  width:clamp(200px, 30vw, 280px);
  height:clamp(300px, 45vh, 400px);
  max-width:100vw;
  z-index:2147483647;
  pointer-events:none;
  transform:translateY(120%);
  transition:transform 2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display:block !important;
  box-sizing:border-box;
}

/* 219 */
.state-up {
  transform:translateY(0%) !important;
}

.state-hide {
  transform:translateY(120%) !important;
}

.state-rest {
  transform:translateY(70%) !important;
}

/* 220 */
.bas-ball {
  position:absolute;
  border-radius:50% 50% 50% 50% / 40% 40% 60% 60%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  pointer-events:auto;
  box-shadow:inset -8px -8px 20px rgba(0,0,0,0.4);
}

/* 221 */
.bas-str {
  position:absolute;
  width:1px;
  background:rgba(255,255,255,0.4);
  bottom:-1000px;
  left:50%;
  height:1000px;
}

/* 222 */
.bas-nipple {
  position:absolute;
  bottom:-10px;
  width:18px;
  height:10px;
  background:inherit;
  clip-path:polygon(20% 0, 80% 0, 100% 100%, 0 100%);
}

/* 223 */
.white-b {
  width:clamp(90px, 12vw, 120px);
  height:clamp(120px, 16vw, 160px);
  background:#ffffff;
  bottom:clamp(180px, 27vw, 220px);
  left:clamp(20px, 6vw, 60px);
  animation:floatW 25s ease-in-out infinite;
  transition:background 0.4s ease;
}

/* 224 */
.blue-b {
  width:clamp(80px, 10vw, 105px);
  height:clamp(100px, 13vw, 135px);
  background:#007bff;
  bottom:clamp(55px, 9vw, 70px);
  left:clamp(15px, 3vw, 30px);
  animation:floatB 20s ease-in-out infinite;
}

/* 225 */
.bas-sticker {
  width:clamp(55px, 8vw, 75px);
  height:clamp(55px, 8vw, 75px);
  border-radius:20px;
  margin-bottom:5px;
  border:1px solid #ddd;
}

/* 226 */
.bas-lbl {
  font-family:sans-serif;
  font-size:clamp(9px, 1.2vw, 11px);
  font-weight:900;
  text-align:center;
  line-height:1.2;
  max-width:100%;
  overflow-wrap:break-word;
}

/* 227 */
.install-ready {
  color:#cddc39 !important;
  text-shadow:0 0 6px rgba(205,220,57,0.35);
}

/* 228 */
.installed-state {
  background:#cddc39 !important;
}

/* 229 */
.installed-state .bas-nipple {
  background:#cddc39 !important;
}

/* 230 */
.installed-state #statTxt {
  color:#1f2b00 !important;
}

/* 231 */
@media (max-width:600px) {

  .food {
    font-size:clamp(18px, 5vw, 27px);
  }

  .brand {
    font-size:clamp(32px, 12vw, 48px);
  }

  .tm {
    font-size:clamp(11px, 3vw, 13px);
  }

  .hub {
    font-size:clamp(15px, 4.5vw, 18px);
    letter-spacing:clamp(1px, 0.5vw, 2px);
  }

  .lang-buttons {
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:8px;
  }

  .lang-btn {
    padding:10px 4px;
    font-size:clamp(11px, 3.2vw, 14px);
  }

  .bas-dedication {
    padding-left:12px;
    padding-right:12px;
    font-size:clamp(18px, 5vw, 24px);
  }

  .lang-title {
    padding-left:12px;
    padding-right:12px;
  }

  .question-box {
    width:96%;
    padding:clamp(14px, 4vw, 20px);
  }

  #install-div {
    right:15px;
    bottom:15px;
  }
}
