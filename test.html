 <!DOCTYPE html>
<html lang="en">
<head>
<style>
/* പേജിലെ എല്ലാ അനാവശ്യ സെലക്ഷനും തടയാൻ */
* {
  -webkit-user-select: none !important;
  -moz-user-select: none !important;
  -ms-user-select: none !important;
  user-select: none !important;
  -webkit-tap-highlight-color: transparent !important;
}

/* സെർച്ച് ബാറുകൾ സാധാരണ പോലെ പ്രവർത്തിക്കാൻ */
input, textarea {
  -webkit-user-select: auto !important;
  -moz-user-select: auto !important;
  -ms-user-select: auto !important;
  user-select: auto !important;
}

/* Standard Responsive Base */
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-size: 19px;
}
</style>

<style>
/* Google Translate top bar + iframe ബ്ലോക്ക് ചെയ്യുന്നു */

}

body {

#goog-gt-tt,

.goog-text-highlight,

<style>
/* CODE NO:1 — RESPONSIVE HEADER BASE */
h1 {
  color:#fff !important;
}

.english-fix {
  color:#bbb !important;
}

#dedication-text {
  color:#bbb !important;
  font-weight:300;
  line-height:1.6;
}

#gallery {
  display:flex;
  overflow-x:auto;
  scroll-behavior:smooth;
  gap:10px;
}

#gallery::-webkit-scrollbar {
  display:none;
}

.card {
  min-width:180px;
  flex-shrink:0;
}

.card img {
  width:100%;
  height:auto;
  border-radius:10px;
  display:block;
}

#gallery.zoom {
  transform:scale(1.05);
  transition:0.3s;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;
  background:#050505;
  font-family:Georgia, serif;
  color:#fff;
  overflow-x:hidden;
  padding-top:clamp(24px, 4vh, 48px);
}

/* Main containers */
.bas-dedication,
.lang-box,
.country-box,
.shop-container,
.compare-container,
.share-container,
.mainbox,
.info-box,
.bas7-wrapper,
.trust-container,
.peace-wrapper,
.vada-wrapper,
.vision-wrapper,
#bas-mega-portal {
  max-width:900px;
  width:96%;
  margin-left:auto;
  margin-right:auto;
}

/* Header */
.header-box {
  display:flex;
  flex-direction:column;
  align-items:center;
  background:#000;
  padding-top:clamp(15px, 3vw, 25px);
  width:100%;
  max-width:100%;
}

#logo-space {
  width:100%;
  height:clamp(220px, 56vw, 340px);
  max-width:100%;
  overflow:hidden;
}

.heading {
  width:100%;
  max-width:100%;
  text-align:center;
  padding:clamp(10px, 3vw, 20px);
  overflow:hidden;
}

/* FOOD WITHOUT SPENDING MONEY */
.food {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(8px, 2vw, 14px);
  margin-bottom:clamp(16px, 4vw, 32px);
  font-family:Georgia,serif;
  font-size:clamp(18px, 4vw, 30px);
  font-weight:400;
  letter-spacing:1px;
  text-transform:uppercase;

  background:linear-gradient(
    180deg,
    #8b6914 0%,
    #d4af37 22%,
    #fff1a8 42%,
    #ffd75a 50%,
    #d4af37 68%,
    #8b6914 100%
  );

  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;

  text-shadow:
    0 1px 1px rgba(255,235,150,.45),
    0 2px 2px rgba(80,50,0,.35);
}

.food::before,
.food::after {
  content:"";
  width:clamp(25px, 6vw, 55px);
  height:2px;
  flex:0 1 auto;
  background:linear-gradient(
    to right,
    transparent,
    #b8860b,
    #ffd700,
    #fff1a8
  );
  box-shadow:0 0 5px rgba(255,215,0,.55);
}

.food::after {
  background:linear-gradient(
    to left,
    transparent,
    #b8860b,
    #ffd700,
    #fff1a8
  );
}

/* BAS CHARITY */
.brand {
  width:100%;
  max-width:100%;
  font-size:clamp(32px, 8vw, 65px);
  font-weight:900;
  line-height:1.05;
  color:#ffffff;
  text-align:center;
  overflow-wrap:break-word;
  word-break:normal;

  text-shadow:
    1px 1px 0 #eeeeee,
    2px 2px 0 #d0d0d0,
    3px 3px 0 #b5b5b5,
    4px 4px 0 #999999,
    5px 5px 0 #7d7d7d,
    6px 6px 0 #626262,
    7px 7px 0 #484848,
    8px 8px 0 #303030,
    10px 10px 0 #1c1c1c,
    13px 14px 18px rgba(0,0,0,.95),
    0 0 22px rgba(255,255,255,.35);
}

 </body>
