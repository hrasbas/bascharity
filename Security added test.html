<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 40px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #d9534f;
            font-size: 22px;
            margin-bottom: 12px;
        }
        p {
            font-size: 16px;
            color: #666;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>സൈറ്റിൽ പണി നടക്കുന്നു!</h1>
        <p>ഉടൻ തന്നെ തിരികെ എത്തുന്നതാണ്.</p>
    </div>
</body>
</html>
