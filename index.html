 <!DOCTYPE html>
<html lang="ml">
<head>
  <!-- 1) അടിസ്ഥാന head block: page charset, mobile viewport, title -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAS Charity Shops</title>
  <meta name="theme-color" content="#000000">

  <!-- 2) പ്രധാന style block: shop UI + balloon UI -->
  <style>
    body{
      background:#000;
      color:#fff;
      font-family:sans-serif;
      margin:0;
      padding-bottom:80px;
    }

    #bas{
      width:96%;
      max-width:900px;
      margin:auto;
      padding:10px;
    }

    #findShop{
      width:100%;
      height:50px;
      border-radius:10px;
      border:1px solid #333;
      background:#111;
      color:#fff;
      padding:0 15px;
      margin-bottom:15px;
      box-sizing:border-box;
      font-size:16px;
    }

    #resetBtn{
      display:block;
      background:#111;
      color:orange;
      padding:14px;
      border-radius:10px;
      text-align:center;
      margin-bottom:20px;
      cursor:pointer;
      font-weight:bold;
      border:1px solid orange;
      user-select:none;
    }

    .btn-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-bottom:20px;
    }

    .m-btn{
      background:#161616;
      color:#eee;
      border:1px solid #333;
      padding:12px 5px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
      font-size:13px;
    }

    .cat-head{
      padding:12px;
      border-radius:8px;
      margin:25px 0 12px;
      text-align:center;
      font-weight:bold;
      color:#fff;
      text-transform:uppercase;
    }

    .shop-card{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px;
      background:#111;
      border-radius:12px;
      margin-bottom:10px;
      text-decoration:none;
      color:#fff;
      border:1px solid currentColor;
      border-left:6px solid orange;
      transition:.2s;
    }

    .shop-card:hover{
      background:#1a1a1a;
      transform:translateX(5px);
    }

    .shop-card img{
      width:38px;
      height:38px;
      background:#fff;
      border-radius:6px;
      padding:4px;
      object-fit:contain;
      flex-shrink:0;
    }

    .info b{
      font-size:17px;
      display:block;
    }

    .info small{
      color:#888;
      font-size:12px;
    }

    /* 3) Balloon wrapper: ഇടത് വശത്ത് floating helper area */
    #basBalloonWrap{
      position:fixed;
      left:0;
      bottom:24px;
      width:260px;
      height:320px;
      z-index:99999;
      pointer-events:none;
      overflow:visible;
    }

    /* 4) കൈ മാത്രം: install കഴിഞ്ഞാൽ ഇത് മാത്രം നിലനിൽക്കും */
    .bas-hand{
      position:absolute;
      left:-90px;
      bottom:0;
      width:120px;
      height:140px;
      opacity:0;
      transform:translateX(-40px);
      transition:all .8s ease;
      pointer-events:none;
    }

    .bas-hand.show{
      opacity:1;
      transform:translateX(0);
    }

    .bas-hand .palm{
      position:absolute;
      bottom:18px;
      left:26px;
      width:76px;
      height:76px;
      background:linear-gradient(145deg,#f4c9a8,#e6ae84);
      border-radius:45% 45% 40% 40%;
      box-shadow:0 8px 20px rgba(0,0,0,.35);
      transform:rotate(-8deg);
    }

    .bas-hand .thumb{
      position:absolute;
      bottom:54px;
      left:12px;
      width:28px;
      height:52px;
      background:linear-gradient(145deg,#f4c9a8,#df9f77);
      border-radius:20px;
      transform:rotate(-25deg);
    }

    .bas-hand .finger{
      position:absolute;
      width:16px;
      background:linear-gradient(145deg,#f6cfb2,#e5ae86);
      border-radius:14px;
      box-shadow:inset 0 -2px 0 rgba(0,0,0,.08);
    }

    .bas-hand .f1{height:58px; left:36px; bottom:78px; transform:rotate(-4deg);}
    .bas-hand .f2{height:68px; left:54px; bottom:84px; transform:rotate(0deg);}
    .bas-hand .f3{height:64px; left:72px; bottom:80px; transform:rotate(5deg);}
    .bas-hand .f4{height:52px; left:90px; bottom:70px; transform:rotate(10deg);}

    /* 5) Balloon base */
    .bas-ball{
      position:absolute;
      border-radius:50% 50% 48% 48% / 42% 42% 58% 58%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      pointer-events:auto;
      box-shadow:
        inset -8px -8px 20px rgba(0,0,0,0.18),
        0 10px 28px rgba(0,0,0,0.35);
      transform:translateY(130%);
      opacity:0;
      transition:
        transform 1.2s cubic-bezier(.18,.89,.32,1.28),
        opacity .5s ease,
        background .35s ease,
        border-color .35s ease;
    }

    .bas-ball.show{
      opacity:1;
      transform:translateY(0);
    }

    .bas-ball.hide{
      opacity:0;
      transform:translateY(140%);
      pointer-events:none;
    }

    .bas-ball.floaty{
      animation-duration:4.2s;
      animation-iteration-count:infinite;
      animation-timing-function:ease-in-out;
    }

    .bas-ball.install-ball{
      width:116px;
      height:152px;
      left:78px;
      bottom:118px;
      background:#ffffff;
      color:#222;
      animation-name:floatInstall;
    }

    .bas-ball.save-ball{
      width:102px;
      height:132px;
      left:28px;
      bottom:22px;
      background:#2e8b57;
      color:#fff;
      animation-name:floatSave;
    }

    .bas-ball.installed{
      background:#19b84a;
      color:#fff;
      border:2px solid #ffffff;
    }

    .bas-ball.installed .plusMark{
      display:inline-flex;
    }

    .bas-ball.white-reset{
      background:#ffffff;
      color:#222;
      border:0;
    }

    .bas-sticker{
      width:44px;
      height:44px;
      border-radius:10px;
      margin-bottom:6px;
      border:1px solid #ddd;
      background:#fff;
      object-fit:contain;
    }

    .bas-lbl{
      font-size:11px;
      font-weight:900;
      text-align:center;
      line-height:1.2;
      padding:0 8px;
      letter-spacing:.3px;
    }

    .plusMark{
      display:none;
      align-items:center;
      justify-content:center;
      margin-top:6px;
      width:20px;
      height:20px;
      border-radius:50%;
      background:#fff;
      color:#19b84a;
      font-weight:900;
      font-size:15px;
      line-height:1;
    }

    .bas-nipple{
      position:absolute;
      bottom:-9px;
      width:18px;
      height:10px;
      background:inherit;
      clip-path:polygon(20% 0, 80% 0, 100% 100%, 0 100%);
    }

    .bas-str{
      position:absolute;
      width:1px;
      background:rgba(255,255,255,.45);
      bottom:-1000px;
      left:50%;
      height:1000px;
    }

    @keyframes floatInstall{
      0%,100%{ transform:translate(0,0) rotate(-3deg); }
      50%{ transform:translate(26px,18px) rotate(4deg); }
    }

    @keyframes floatSave{
      0%,100%{ transform:translate(0,0) rotate(4deg); }
      50%{ transform:translate(18px,-14px) rotate(-4deg); }
    }

    @media (max-width: 480px){
      .btn-grid{ grid-template-columns:repeat(2,1fr); }
      .info b{ font-size:15px; }
      #basBalloonWrap{ transform:scale(.92); transform-origin:left bottom; }
    }
  </style>
</head>

    let activeCountry = "";
    let basPrompt = null;
    let isInstalled = false;
    let saveBallGone = false;

  <!-- 11) Render/search/filter block -->
  <script>
    function render(data){
      let out = document.getElementById("out");
      out.innerHTML = "";

      const isIndia = (activeCountry || "").toLowerCase() === "india" || activeCountry === "";

      cats.forEach(cat => {
        let g = data.filter(s => s.c === cat);
        if(!g.length) return;

        if(isIndia){
          out.innerHTML += `<div class="cat-head" style="background:${colors[cat]}">${cat}</div>`;
        }

        g.forEach(s => {
          out.innerHTML += `
            <a class="shop-card" href="${s.u}" target="_blank" rel="noopener noreferrer" style="border-left-color:${colors[cat]}">
              <img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(s.d)}&sz=64" alt="${s.n}">
              <div class="info">
                <b class="notranslate" translate="no">${s.n}</b>
                <small>${s.t}</small>
              </div>
            </a>
          `;
        });
      });
    }

    function search(){
      let v = document.getElementById("findShop").value.toLowerCase();
      let data = shops;

      if(activeCountry && activeCountry !== "All Countries"){
        data = data.filter(s =>
          (s.country && s.country.toLowerCase() === activeCountry.toLowerCase()) ||
          (s.country && s.country.toLowerCase() === "all")
        );
      }

      if(v){
        data = data.filter(s =>
          s.n.toLowerCase().includes(v) ||
          s.t.toLowerCase().includes(v)
        );
      }

      render(data);
    }

    function resetView(){
      document.getElementById("findShop").value = "";
      search();
    }

    function filter(cat){
      let data = shops.filter(s => s.c === cat);

      if(activeCountry && activeCountry !== "All Countries"){
        data = data.filter(s =>
          (s.country && s.country.toLowerCase() === activeCountry.toLowerCase()) ||
          (s.country && s.country.toLowerCase() === "all")
        );
      }

      render(data);
    }

    function initBtns(){
      let b = "";
      cats.forEach(c => {
        b += `<button class="m-btn" onclick="filter('${c.replace(/'/g, "\\'")}')" style="border-bottom:2px solid ${colors[c]}">${c}</button>`;
      });
      document.getElementById("btns").innerHTML = b;
    }

    function detectUserCountry(){
      fetch("https://ipapi.co/json/")
        .then(r => r.json())
        .then(d => {
          const map = {
            "India":"India",
            "United States":"USA",
            "United Kingdom":"UK",
            "United Arab Emirates":"UAE",
            "Saudi Arabia":"Saudi",
            "Singapore":"Singapore",
            "Malaysia":"Malaysia",
            "Canada":"Canada"
          };
          activeCountry = map[d.country_name] || "India";
          search();
          initBtns();
        })
        .catch(() => {
          activeCountry = "India";
          search();
          initBtns();
        });
    }
  </script>

  <!-- 12) Balloon helper functions block -->
  <script>
    const basHand = document.getElementById("basHand");
    const installBall = document.getElementById("installBall");
    const saveBall = document.getElementById("saveBall");
    const statTxt = document.getElementById("statTxt");
    const plusMark = document.getElementById("plusMark");

    function showHand(){
      basHand.classList.add("show");
    }

    function showInstallBall(){
      if(isInstalled) return;
      installBall.classList.remove("hide");
      installBall.classList.add("show","floaty");
    }

    function showSaveBall(){
      if(isInstalled || saveBallGone) return;
      saveBall.classList.remove("hide");
      saveBall.classList.add("show","floaty");
    }

    function hideSaveBallForever(){
      saveBall.classList.remove("show","floaty");
      saveBall.classList.add("hide");
      saveBallGone = true;
    }

    function handOnlyMode(){
      installBall.classList.remove("show","floaty");
      installBall.classList.add("hide");

      saveBall.classList.remove("show","floaty");
      saveBall.classList.add("hide");
    }

    function resetInstallBalloonToWhite(){
      isInstalled = false;
      installBall.classList.remove("installed");
      installBall.classList.add("white-reset");
      statTxt.innerText = "INSTALL";
      plusMark.style.display = "none";
    }

    function celebrateInstalled(){
      isInstalled = true;
      installBall.classList.remove("white-reset");
      installBall.classList.add("installed","show","floaty");
      statTxt.innerText = "INSTALLED";
      plusMark.style.display = "inline-flex";

      saveBall.classList.remove("show","floaty");
      saveBall.classList.add("hide");

      setTimeout(() => {
        handOnlyMode();
      }, balloonTiming.greenCelebrateSec * 1000);
    }

    function startBalloonSequence(){
      showHand();

      setTimeout(() => {
        if(!isInstalled) showInstallBall();
      }, Math.max(0, (balloonTiming.installBalloonRiseSec - balloonTiming.handFirstAppearSec) * 1000));

      setTimeout(() => {
        if(!isInstalled) showSaveBall();
      }, Math.max(0, (balloonTiming.saveBalloonRiseSec - balloonTiming.handFirstAppearSec) * 1000));

      setTimeout(() => {
        if(!isInstalled) hideSaveBallForever();
      }, Math.max(0, (balloonTiming.saveHideAfterSec - balloonTiming.handFirstAppearSec) * 1000));
    }

    function goSavePhone(){
      const url = location.href;
      const text = "Save this to phone / Install app:\
\
" + url + "\
\
Open in Chrome → menu → Add to Home screen / Install app";
      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
    }
  </script>

  <!-- 13) PWA install logic block -->
  <script>
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      basPrompt = e;

      /* uninstall-ിന് direct event ഇല്ല; വീണ്ടും prompt ലഭിച്ചാൽ install വീണ്ടും possible എന്നു assume ചെയ്യുന്നു */
      if(!isInstalled){
        resetInstallBalloonToWhite();
        installBall.classList.remove("hide");
      }
    });

    async function handleInstallTap(){
      if(!basPrompt){
        alert("Install option Chrome/compatible browser-ിൽ മാത്രം വരാം.");
        return;
      }

      try{
        basPrompt.prompt();
        const choice = await basPrompt.userChoice;

        if(choice && choice.outcome === "accepted"){
          celebrateInstalled();
        }
      }catch(err){
        console.log("Install prompt error", err);
      }

      basPrompt = null;
    }

    window.addEventListener("appinstalled", () => {
      celebrateInstalled();
      basPrompt = null;
    });
  </script>

  <!-- 14) Service worker block: sw.js ഉണ്ടായാൽ മാത്രം register ചെയ്യും -->
  <script>
    if("serviceWorker" in navigator){
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>

  <!-- 15) Main init block -->
  <script>
    window.addEventListener("load", () => {
      detectUserCountry();

      setTimeout(() => {
        startBalloonSequence();
      }, balloonTiming.handFirstAppearSec * 1000);
    });
  </script>
